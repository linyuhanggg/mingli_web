components:
  securitySchemes:
    deviceSession:
      type: apiKey
      in: cookie
      name: mingli_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Persisted per owner; the same key always returns the same Reading Version
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          enum: [api, database]
    CapabilityProjection:
      type: object
      additionalProperties: false
      required:
        [capability_id, label, tier, source_system, runtime_active_rule_count,
         judgment_rule_count, source_status]
      properties:
        capability_id:
          type: string
        label:
          type: string
        tier:
          type: string
          enum: [A, B, C]
        source_system:
          type: [string, "null"]
        runtime_active_rule_count:
          type: integer
          minimum: 0
        judgment_rule_count:
          type: integer
          minimum: 0
        source_status:
          type: string
          enum: [available, unavailable]
        user_decision_pending:
          type: boolean
          default: false
    CapabilityProjectionResponse:
      type: object
      additionalProperties: false
