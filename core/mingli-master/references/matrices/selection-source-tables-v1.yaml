hard_constraint_contract:
  supported_fields: [excluded_dates, allowed_weekdays, excluded_weekdays, allowed_hour_branches, excluded_hour_branches, time_windows, earliest_date, latest_date, participant_clash_is_hard]
  participant_clash_is_hard_default: true
  policy: each mismatch creates an explicit elimination reason; hard constraints never enter ranking components

candidate_output_contract:
  day_candidates: retain every civil day with full rejection reasons
  date_time_candidates: split each day into calculated double-hour calendar variants, including both civil Zi segments, exact Jie transitions, and repeated-time folds
  eligibility: a date-time candidate is eligible only when both its parent day and its exact civil-time segment satisfy hard constraints
  identity: each date-time candidate is bound to its UTC instant, local interval, hour branch, calendar digest, and source dependency

ranking:
  method: explainable_lexicographic_v1
  opaque_numeric_score: false
  component_order:
    - hard_eligible_first
    - fewer_official_event_avoid_matches
    - more_official_event_recommend_matches
    - more_active_event_favorable_facts
    - official_huang_day_first
    - official_huang_hour_first
    - fewer_participant_clashes
    - earlier_civil_instant
  folk_affects_rank: false
