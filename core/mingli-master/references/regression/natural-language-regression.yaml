          - fengshui/yangzhai-sanyao
        support_packs:
          - fengshui/huangdi-zhaijing
          - fengshui/qingnang-aoyu
          - fengshui/dili-bianzheng
        required_adapter: tool.fengshui
      expected_path:
        fact_layer_state: incomplete_property_facts
        must_stop_before_interpretation: true_for_liqi_or_financial_claims
        direct_answer_allowed: true_only_for_visible_form_observations
        required_missing_outputs:
          - 罗盘度数/坐向
          - 元运_or_八宅福元宅卦
          - 户型布局
          - 门灶床水位置
          - declared_school
        forbidden_answer_moves:
          - wealth_position_from_facing_text_only
          - mix_yin_and_yang_house_rules_without_boundary

    - id: nl-013-physiognomy-direct-but-auxiliary
      prompt: 只看面相能不能断一个人一定会不会发财？
      legacy_prompt_ids:
        - physiognomy-direct-reading
      coverage:
        - physiognomy
      expected_route:
        system: physiognomy
        required_references:
          - references/system-cards/physiognomy.md
        source_packs_from_active_rule_ids_only: true
      expected_path:
        fact_layer_state: target_scoped_physiognomy_spec_needed
        must_stop_before_interpretation: true_for_person_specific_verdict
        direct_answer_allowed: true_for_capability_boundary_only
        public_answer_requirements:
          - State directly that visible observations cannot prove wealth or certainty.
          - If observations are supplied, keep lighting/angle/filtering/occlusion quality, uncertainty, conflicts, and cross-capture non-equivalence explicit.
          - Use only exact provider-activated terminology, methodology, and edition-boundary evidence.
        forbidden_answer_moves:
          - certain_wealth_fact_from_face
          - wealth_likelihood_or_personality_health_lifespan_verdict
          - infer_unseen_feature
          - fixed_pack_expansion_or_bingjian_fallback
          - expose_private_image_or_transaction_provenance

    - id: nl-014-bazi-shensha-inventory
      prompt: 我命里的神煞都有哪些？天乙、禄神、白虎、天医这些是不是都一回事？
      coverage:
        - bazi
        - shensha
      expected_route:
        system: bazi_shensha
        required_references:
          - references/matrices/shensha-cross-system-index.md
          - references/matrices/shensha-name-disambiguation.yaml
          - references/matrices/shensha-entry-source-profile.yaml
          - references/matrices/shensha-quote-trace.yaml
