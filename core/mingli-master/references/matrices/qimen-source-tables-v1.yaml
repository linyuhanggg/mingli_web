selected_convention:
  id: shijia-zhuanpan-chaibu-xieji-v1
  version: 1.0.0
  board_type: xieji_spatial_ring_rotating
  ju_method: chaibu
  term_boundary: shared_exact_solar_term_instant
  yuan_method: most_recent_jia_or_ji_day_symbol_head
  day_rollover: shared_calendar_policy
  center_hosting: always_kun_2
  deity_profile: baihu_xuanwu_variant
  hour_basis: shared_calendar_effective_datetime
  boundary_rules:
    - the active solar term changes at its exact instant under the versioned shared modern calendar boundary; the classical Chaibu passage identifies only the transition day
    - the most recent Jia or Ji day is the five-day symbol head
    - symbol-head branches Zi Wu Mao You are upper Yuan
    - symbol-head branches Yin Shen Si Hai are middle Yuan
    - symbol-head branches Chen Xu Chou Wei are lower Yuan
    - Yang Dun applies from winter solstice through the instant before summer solstice
    - Yin Dun applies from summer solstice through the instant before winter solstice
    - instruments fly forward in Yang Dun and reverse in Yin Dun
    - stars rotate on the spatial eight-palace ring under the Xieji stated alternative
    - doors rotate on the spatial eight-palace ring as stated by Xieji
    - deities rotate on the spatial eight-palace ring and are checked by the L1193 worked row
    - the center star and any center landing are hosted in Kun palace 2
  incompatible_alternatives:
    - id: shijia-zhuanpan-zhirun
      status: separate_not_selected
      reason: source-declared intercalation and Chao/Jie chronology cannot be merged with Chaibu
    - id: shijia-maoshan-sixty-double-hours
      status: separate_not_selected
      reason: Yuan follows elapsed double-hours from the term rather than the Jia/Ji symbol head
    - id: feipan
      status: separate_not_selected
      reason: nine-star flying and deity placement differ from the selected rotating plate
    - id: tongzong-chaojie-zhirun
      status: separate_not_selected
      reason: Tongzong L73-L93 advances or delays the active term by Fu-head and intercalation; selected Chaibu follows Xieji L11612 exact-term splitting
    - id: tongzong-numeric-outer-door-rotation
      status: separate_not_selected
      reason: the complete Tongzong L659 row moves doors on numeric outer-palace order, conflicting with the selected Xieji spatial-ring plate
    - id: rotating-yang-gen-yin-kun-hosting
      status: separate_not_selected
      reason: center hosting differs from the selected always-Kun convention
    - id: gouchen-zhuque-deities
      status: separate_not_selected
      reason: source preserves these names alongside the selected Baihu/Xuanwu variant

