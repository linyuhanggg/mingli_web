schema_version: mingli-name-analysis-source-rules-v1
updated_at: "2026-08-21"
runtime_binding: not_in_runtime
provider_status: local_provider_not_in_runtime
method_id: wuyin-xingshi-from-wuxing-jingji-v1
excluded_methods:
  - kangxi_stroke_count
  - wuge_sancai_numerology
  - personality_or_luck_verdict
audit_policy:
  research_source_root: external
  research_sources_distribution: local_research_only
  release_material: distilled_rules_provenance_and_checksums_only
  note: >-
    v1 freezes surname 五音 identity from 《五行精纪》卷九《辨五音訣》and the five
    五音姓氏 tables. Remaining unambiguous 单姓 rows are collated from the
    local fulltext. Compound surnames are independently pinned only when the
    two-character span sits in one tone table before a 一云 span. OCR-garbled
    spans, 一云别音 rows, fragments, and surnames that appear in more than one
    tone table stay unmatched. 康熙笔画、五格剖象、三才数理吉凶 remain out of
    scope. This matrix is not in catalog or the signed Runtime.

source_registry:
  wuxing_jingji_wuyin: &wuxing_jingji_wuyin
    title: 五行精纪
    edition_or_recension: 本地 normalized 通行整理本；卷九五音姓氏表有录入噪声，v1 钉可独立核验行并排除跨表冲突
    normalized_path: references/fulltext/luming-nayin/wuxing-jingji/fulltext.md
    sha256: 32e0581bcba3b1b6df2b8e0c48db135a4a6f27e7dca2f010e0a818ab6ba9e08b
    anchor: L2951-L2991 辨五音訣与五音姓氏
    exact_excerpt: 舌音為徵，齒為商，牙角，喉宮，唇羽，方能五姓類中，用見圖達者盡規章。
    material: surname 五音 classification and five tone tables; no natal verdict
    license_status: ancient text public domain; normalized source local research only

tone_to_element:
  宫: earth
  商: metal
  角: wood
  徵: fire
  羽: water

rules:
  - id: name-analysis/wuxing-jingji#NA-WX-01
    title: 五音发音分类
    status: verified
    evidence_role: terminology_only
    primary_sources: [*wuxing_jingji_wuyin]
    quote_index: WX-Q231
    source_anchor: fulltext.md#L2953
    exact_excerpt: 舌音為徵，齒為商，牙角，喉宮，唇羽，方能五姓類中，用見圖達者盡規章。
    statement: >-
      舌音为徵、齿为商、牙为角、喉为宫、唇为羽。这是五姓分类口诀，不是吉凶断语。
    boundary:
      - do not emit luck, wealth, or personality from the articulatory classes
      - articulatory class alone never assigns a surname; table lookup is required

  - id: name-analysis/wuxing-jingji#NA-WX-01b
    title: 五音贵旺月令标记
    status: verified
    evidence_role: identity_marker_only
    primary_sources: [*wuxing_jingji_wuyin]
    source_anchor: fulltext.md#L2955
    exact_excerpt: 商音為金，旺在申酉，德在辰巳，角音屬木，旺在寅卯，德在戌亥，徵音屬火，旺在巳午，德在醜寅，宮羽音屬水土，旺在亥子，德在未申
    statement: >-
      五音各有旺支与德支。v1 只输出这些支标记，hard_verdict 必须为 null。
    seasonal_markers:
      商: {element: metal, wang_branches: [申, 酉], de_branches: [辰, 巳]}
      角: {element: wood, wang_branches: [寅, 卯], de_branches: [戌, 亥]}
      徵: {element: fire, wang_branches: [巳, 午], de_branches: [丑, 寅]}
      宫: {element: earth, wang_branches: [亥, 子], de_branches: [未, 申]}
      羽: {element: water, wang_branches: [亥, 子], de_branches: [未, 申]}
    boundary:
      - markers are identity facts, not 贵盛 or 有禄 conclusions
      - yangzhai 鸣吠/安葬 procedures are a source_gap in v1

