components:
  parameters:
    AdminCsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: Double-submit token matching the mingli_admin_csrf cookie
    RevisionId:
      name: revision_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
  schemas:
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 200
    AdminSessionResponse:
      type: object
      additionalProperties: false
      required: [staff_id, session_id, role, display_name, expires_at, csrf_token]
      properties:
        staff_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/StaffRole"
        display_name:
          type: string
        expires_at:
          type: string
          format: date-time
        csrf_token:
          type: string
    AdminMeResponse:
      type: object
      additionalProperties: false
      required: [staff_id, role, email, display_name, session_id, expires_at]
      properties:
        staff_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/StaffRole"
        email:
          type: string
          format: email
        display_name:
          type: string
        session_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    AdminSessionRevokeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AdminStaffSessionResponse:
      type: object
      additionalProperties: false
      required:
        [id, staff_user_id, actor, status, expires_at, last_seen_at, revoked_at,
         created_at]
      properties:
        id:
          type: string
          format: uuid
        staff_user_id:
          type: string
          format: uuid
        actor:
          type: string
        status:
          type: string
          enum: [active, expired, revoked]
        expires_at:
          type: string
          format: date-time
