openapi: 3.1.0
info:
  title: FateRadar Admin API
  version: 0.1.0
  description: >
    Staff-only operations console contract. Independent of the public user API.
    Cookie names: mingli_admin_session (HttpOnly) and mingli_admin_csrf (readable).
servers:
  - url: /
    description: Same-origin admin entry
tags:
  - name: Admin Auth
  - name: Admin Ops
  - name: Admin Entitlements
  - name: Admin Catalog
  - name: Admin Reconciliation
  - name: Admin Notifications
  - name: Admin Audit
  - name: Admin Sessions
  - name: Admin Staff
  - name: Admin Settings
  - name: Admin Commerce
  - name: Admin Identity
  - name: Admin Readings
  - name: Admin Runtime
  - name: Admin Capabilities
  - name: Admin Model Profiles
  - name: Admin Referrals
  - name: Admin Referral Appeals
  - name: Admin Support Cases
  - name: Admin Privacy
  - name: Admin CMS
paths:
  /api/v1/admin/auth/login:
    post:
      operationId: adminLogin
      tags: [Admin Auth]
      summary: Create a staff session with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Staff session created; opaque cookies set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [Admin Auth]
      summary: Revoke the current staff session and clear admin cookies
      parameters:
        - $ref: "#/components/parameters/AdminCsrfToken"
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/me:
    get:
      operationId: adminMe
      tags: [Admin Auth]
      summary: Return the authenticated staff principal
      responses:
        "200":
          description: Current staff user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/admin/overview:
    get:
      operationId: adminOverview
      tags: [Admin Ops]
      summary: Ops desk KPI facts and work queues
      responses:
        "200":
          description: Overview payload built from persisted order, payment, refund, reading-job, and reconciliation facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/admin/entitlements/events:
    get:
      operationId: listAdminEntitlementEvents
      tags: [Admin Entitlements]
      summary: List append-only entitlement events for a user
      parameters:
        - name: owner_user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: entitlement_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 160
      responses:
        "200":
          description: Entitlement event history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEntitlementEventsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: adjustAdminEntitlement
      tags: [Admin Entitlements]
      summary: Append an audited grant, compensation, or revoke event
      parameters:
        - $ref: "#/components/parameters/AdminCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEntitlementAdjustmentRequest"
      responses:
        "201":
          description: Adjustment appended and audited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEntitlementAdjustmentResponse"
        "200":
          description: Idempotent replay of an existing adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEntitlementAdjustmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/entitlements/events/recent:
    get:
      operationId: listRecentAdminEntitlementEvents
      tags: [Admin Entitlements]
      summary: List recent entitlement ledger events across owners
      parameters:
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: Recent append-only entitlement events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEntitlementEventsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/catalog:
    get:
      operationId: listAdminCatalog
      tags: [Admin Catalog]
      summary: List product families, versions, and channel offers
      responses:
        "200":
          description: Current catalog state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/catalog/families:
    post:
      operationId: createAdminCatalogFamily
      tags: [Admin Catalog]
      summary: Create an audited product family
      parameters:
        - $ref: "#/components/parameters/AdminCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogFamilyCreateRequest"
      responses:
        "201":
          description: Product family created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogFamilyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/catalog/versions:
    post:
      operationId: createAdminCatalogVersion
      tags: [Admin Catalog]
      summary: Create an immutable draft product version
      parameters:
        - $ref: "#/components/parameters/AdminCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogVersionCreateRequest"
      responses:
        "201":
          description: Product version created as draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/catalog/offers:
    post:
      operationId: createAdminCatalogOffer
      tags: [Admin Catalog]
      summary: Create a channel offer for a product version
      parameters:
        - $ref: "#/components/parameters/AdminCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogOfferCreateRequest"
      responses:
        "201":
          description: Product offer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogOfferResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/catalog/versions/{version_id}/publish:
    post:
      operationId: publishAdminCatalogVersion
      tags: [Admin Catalog]
      summary: Publish a draft product version with an enabled offer
      parameters:
        - $ref: "#/components/parameters/AdminCsrfToken"
        - name: version_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogReasonRequest"
      responses:
        "200":
          description: Product version published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/catalog/versions/{version_id}/retire:
    post:
      operationId: retireAdminCatalogVersion
      tags: [Admin Catalog]
      summary: Retire an active product version without changing its snapshot
      parameters:
        - $ref: "#/components/parameters/AdminCsrfToken"
        - name: version_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogReasonRequest"
      responses:
        "200":
          description: Product version retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/catalog/offers/{offer_id}/enabled:
    post:
      operationId: setAdminCatalogOfferEnabled
      tags: [Admin Catalog]
      summary: Enable or disable a channel offer
      parameters:
        - $ref: "#/components/parameters/AdminCsrfToken"
        - name: offer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogOfferEnabledRequest"
      responses:
        "200":
          description: Offer state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogOfferResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/reconciliation:
    get:
      operationId: listAdminReconciliationRuns
      tags: [Admin Reconciliation]
      summary: List recent reconciliation runs and discrepancy counts
      responses:
        "200":
          description: Recent reconciliation runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReconciliationRunsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/reconciliation/runs:
    post:
      operationId: createAdminReconciliationRun
      tags: [Admin Reconciliation]
      summary: Run reconciliation over a verified normalized provider snapshot
      parameters:
        - $ref: "#/components/parameters/AdminCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReconciliationRunRequest"
      responses:
        "201":
          description: Reconciliation run persisted with discrepancy items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReconciliationRunResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/reconciliation/runs/{run_id}:
    get:
      operationId: getAdminReconciliationRun
      tags: [Admin Reconciliation]
      summary: Read one reconciliation run and its discrepancy items
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reconciliation run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReconciliationRunResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/notifications:
    get:
      operationId: listAdminNotifications
      tags: [Admin Notifications]
      summary: List notification delivery state without user payloads
      responses:
        "200":
          description: Notification outbox delivery state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotificationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/notifications/{notification_id}/retry:
    post:
      operationId: retryAdminNotification
      tags: [Admin Notifications]
      summary: Requeue one terminal notification failure
      parameters:
        - $ref: "#/components/parameters/AdminCsrfToken"
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminNotificationRetryRequest"
      responses:
        "200":
          description: Notification requeued with attempt history preserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotificationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/audit:
    get:
      operationId: listAdminAuditEvents
      tags: [Admin Audit]
      summary: List redacted staff audit events
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: staff_user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Redacted audit event history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditEventsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/sessions:
    get:
      operationId: listAdminStaffSessions
      tags: [Admin Sessions]
      summary: List staff session metadata without opaque token material
      responses:
        "200":
          description: Staff session inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStaffSessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/sessions/{session_id}/revoke:
    post:
      operationId: revokeAdminStaffSession
      tags: [Admin Sessions]
      summary: Revoke one staff session and write an audit event
      parameters:
        - $ref: "#/components/parameters/AdminCsrfToken"
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSessionRevokeRequest"
      responses:
        "200":
          description: Revoked staff session metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStaffSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/staff:
    get:
      operationId: listAdminStaff
      tags: [Admin Staff]
      summary: List staff directory metadata without password material
      responses:
        "200":
          description: Staff directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStaffListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createAdminStaff
      tags: [Admin Staff]
      summary: Create a local staff account with audited reason
      parameters:
        - $ref: "#/components/parameters/AdminCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStaffCreateRequest"
      responses:
        "201":
          description: Staff account created without password material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStaffResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/staff/{staff_id}/status:
    post:
      operationId: updateAdminStaffStatus
      tags: [Admin Staff]
      summary: Suspend or reactivate one staff account
      parameters:
        - $ref: "#/components/parameters/AdminCsrfToken"
        - name: staff_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStaffStatusRequest"
      responses:
        "200":
          description: Updated staff metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStaffResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/staff/{staff_id}/role:
    post:
      operationId: updateAdminStaffRole
      tags: [Admin Staff]
      summary: Change one staff role and revoke its existing sessions
      parameters:
        - $ref: "#/components/parameters/AdminCsrfToken"
        - name: staff_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStaffRoleRequest"
      responses:
        "200":
          description: Updated staff metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStaffResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/staff/{staff_id}/password-reset:
    post:
      operationId: resetAdminStaffPassword
      tags: [Admin Staff]
      summary: Reset one staff password and revoke its existing sessions
      parameters:
        - $ref: "#/components/parameters/AdminCsrfToken"
        - name: staff_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStaffPasswordResetRequest"
      responses:
        "200":
          description: Updated staff metadata without password material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStaffResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/settings:
    get:
      operationId: getAdminSettings
      tags: [Admin Settings]
      summary: Read safe runtime configuration flags without secrets
      responses:
        "200":
          description: Non-secret runtime settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/commerce/orders:
    get:
      operationId: listAdminOrders
      tags: [Admin Commerce]
      summary: List local order and fulfillment facts
      parameters:
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: Recent orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrdersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/commerce/payments:
    get:
      operationId: listAdminPayments
      tags: [Admin Commerce]
      summary: List local payment confirmation facts
      parameters:
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: Recent payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPaymentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/commerce/refunds:
    get:
      operationId: listAdminRefunds
      tags: [Admin Commerce]
      summary: List local refund facts
      parameters:
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: Recent refunds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRefundsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/privacy/closures:
    get:
      operationId: listAccountClosures
      tags: [Admin Privacy]
      summary: List pending account closure requests
      responses:
        "200":
          description: Pending closure queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosureListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      tags: [Admin Identity]
      summary: List redacted user identity and data-rights metadata
      parameters:
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: Redacted user directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/users/{user_id}:
    get:
      operationId: getAdminUser
      tags: [Admin Identity]
      summary: Read one user's authorized identity, consent, session, and Subject metadata
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Redacted user detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/subjects:
    get:
      operationId: listAdminSubjects
      tags: [Admin Identity]
      summary: List Subject and ProfileVersion metadata without encrypted payloads
      parameters:
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: Redacted Subject directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSubjectsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/subjects/{subject_id}:
    get:
      operationId: getAdminSubject
      tags: [Admin Identity]
      summary: Read one Subject's version, authorization, and decrypted business facts without encrypted payloads
      parameters:
        - name: subject_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Redacted Subject detail
