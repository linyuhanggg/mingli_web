          - references/matrices/shensha-ss-b4-ziwei-xingming-refinement.md
        primary_packs:
          - xingming/guotian-jing
          - xingming/xingming-suyuan
          - xingming/xingxue-dacheng
        required_adapter: tool.xingming.bindisk
      expected_path:
        fact_layer_state: missing
        must_stop_before_interpretation: true
        direct_answer_allowed: false
        required_missing_outputs:
          - calendar_normalization
          - ephemeris_source_version
          - 星曜位置
          - 十一曜
          - 十二宫
          - 命宫
          - time_location_timezone
        forbidden_answer_moves:
          - astronomical_position_from_memory
          - blocked_qizheng_text_as_primary

    - id: nl-011-selection-move-or-travel
      prompt: 下周哪天适合搬家/出行？我只知道端午那几天，直接给最吉日。
      legacy_prompt_ids:
        - selection-calendar-required
        - selection-travel-no-anchor-only
      coverage:
        - selection
      expected_route:
        system: selection
        required_references:
          - references/matrices/selection-fact-layer-profile.md
          - references/matrices/selection-fact-layer-profile.yaml
          - references/matrices/shensha-ss-b2-selection-refinement.md
        primary_packs:
          - selection/xieji-bianfang-shu
          - selection/xingli-kaoyuan
        support_packs:
          - selection/yuqia-ji
          - selection/donggong-zeri
        required_adapter: mingli-master.selection.v1
      expected_path:
        fact_layer_state: deterministic_selection_candidates
        must_stop_before_interpretation: false
        direct_answer_allowed: true
        required_calculated_outputs:
          - calendar_normalization
          - candidate_dates
          - 建除
          - 神煞
          - 黄黑道
          - 宜忌
          - 冲煞/避忌
          - 驿马/天马_for_travel
          - 往亡/归忌_for_travel
          - 四离四绝/杨公忌_for_travel
          - 黄道吉时_for_travel
        forbidden_answer_moves:
          - best_day_from_lunar_or_ganzhi_anchor
          - single_shensha_selection
          - ask_user_to_resend_original_question
          - expose_internal_missing_fact_workflow

    - id: nl-012-fengshui-missing-property-facts
      prompt: 坐东朝西的房子风水好吗？只有户型图和大门朝西，直接看财位怎么布置。
      legacy_prompt_ids:
        - fengshui-missing-compass
        - real-housing-facing-question
      coverage:
        - fengshui
      expected_route:
        system: fengshui
        required_references:
          - references/tool-adapters.md
          - references/system-cards/fengshui.md
          - references/matrices/shensha-ss-b5-yangzhai-refinement.md
        primary_packs:
