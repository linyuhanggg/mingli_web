openapi: 3.1.0
info:
  title: 命理工具 API
  version: 0.1.0
  description: Identity, profile, reading and presentation contract.
servers:
  - url: /
    description: Same-origin web entry
tags:
  - name: Health
  - name: Capabilities
  - name: Content
  - name: Identity
  - name: Referrals
  - name: Commerce
  - name: Profiles
  - name: Readings
  - name: Physiognomy
paths:
  /api/v1/health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Confirm that the API process can serve requests
      responses:
        "200":
          description: API process is live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Confirm that required durable dependencies are reachable
      responses:
        "200":
          description: API and PostgreSQL are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/capabilities:
    get:
      operationId: listCapabilityProjection
      tags: [Capabilities]
      summary: List Capability Projection
      responses:
        "200":
          description: Public projection of the admitted Runtime capability tiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityProjectionResponse"
  /api/v1/content:
    get:
      operationId: listPublishedContent
      tags: [Content]
      summary: List the current published content projection
      parameters:
        - name: prefix
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: locale
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 16
            default: zh-CN
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
          description: Case-insensitive search over published content metadata and body
        - name: topic
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Published content keyed by the public content namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPublicResponse"
  /api/v1/content/{content_key}:
    get:
      operationId: getPublishedContent
      tags: [Content]
      summary: Read one current published content projection
      parameters:
        - name: content_key
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
        - name: locale
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 16
            default: zh-CN
      responses:
        "200":
          description: Current published content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPublicItem"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/guest-sessions:
    post:
      operationId: createGuestSession
      tags: [Identity]
      summary: Create or rotate a short-lived anonymous browser session
      responses:
        "201":
          description: Guest Session created; opaque token is set as an HttpOnly cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestSessionResponse"
  /api/v1/auth/otp/request:
    post:
      operationId: requestOtp
      tags: [Identity]
      summary: Request a phone or email one-time code through the configured adapter
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "202":
          description: Request accepted without disclosing whether an identity exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallengeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [Identity]
      summary: Verify a code and create a revocable Device Session
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: Identity verified and Device Session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/password/login:
    post:
      operationId: loginWithPassword
      tags: [Identity]
      summary: Verify a previously configured password and create a Device Session
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: Password verified and Device Session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/password/recover:
    post:
      operationId: recoverPassword
      tags: [Identity]
      summary: Verify an OTP for an existing identity and replace its password
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryRequest"
      responses:
        "200":
          description: Password replaced and a fresh Device Session created
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/register:
    post:
      operationId: registerWithOtp
      tags: [Identity]
      summary: Verify an OTP, set a password, and record registration policy consent
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "200":
          description: Identity registered and Device Session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/password:
    put:
      operationId: setPassword
      tags: [Identity]
      summary: Set or replace the password for the current verified account
      security:
        - deviceSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "204":
          description: Password hash stored; plaintext is never persisted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/consents:
    post:
      operationId: recordConsent
      tags: [Identity]
      summary: Append a policy-version consent record to the current account
      security:
        - deviceSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
      responses:
        "201":
          description: Versioned consent recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Identity]
      summary: Revoke the current Device Session
      security:
        - deviceSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Current Device Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/sessions/revoke-all:
    post:
      operationId: revokeAllSessions
      tags: [Identity]
      summary: Revoke every active Device Session for the current account
      security:
        - deviceSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: All active Device Sessions revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/account:
    get:
      operationId: getAccount
      tags: [Identity]
      summary: Read the current internal User and verified Login Identities
      security:
        - deviceSession: []
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/account/export:
    get:
      operationId: exportAccountData
      tags: [Identity]
      summary: Export the current account data and decrypted profile payloads
      security:
        - deviceSession: []
      responses:
        "200":
          description: Account data export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/account/referrals:
    get:
      operationId: listAccountReferrals
      tags: [Identity]
      summary: Read private referral campaign progress for the current account
      security:
        - deviceSession: []
      responses:
        "200":
          description: Safe referral progress without user or payment identifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountReferralsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/referrals/{code}:
    get:
      operationId: getReferralInvite
      tags: [Referrals]
      summary: Read a safe public invitation status without exposing inviter identity
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Public campaign status and current browser attribution state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralPublicResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/referrals/{code}/attribution:
    post:
      operationId: recordReferralAttribution
      tags: [Referrals]
      summary: Record the current active invitation against the anonymous guest session
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: code
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "201":
          description: Temporary attribution recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralAttributionCaptureResponse"
        "200":
          description: Existing temporary attribution refreshed idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralAttributionCaptureResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: clearReferralAttribution
      tags: [Referrals]
      summary: Clear anonymous temporary invitation attribution before registration
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: code
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "204":
          description: Temporary attribution cleared; repeated clears are idempotent
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/commerce/checkout:
    post:
      operationId: createBaziDeepCheckout
      tags: [Commerce]
      summary: Create an owner-scoped Bazi deep-reading checkout
      description: >-
        The server derives the purchase target from the owned Reading Root.
        The client cannot provide an arbitrary target reference or offer UUID.
        The server selects exactly one enabled Offer under the active
        bazi-deep ProductFamily; zero or multiple eligible Offers fail closed.
        A checkout response never represents a confirmed payment unless a
        local Payment fact is already confirmed.
      security:
        - deviceSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicBaziCheckoutRequest"
      responses:
        "201":
          description: Checkout order and payment attempt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCheckoutResponse"
        "200":
          description: Existing checkout returned for an idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCheckoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/commerce/checkout/{order_id}:
    get:
      operationId: getBaziDeepCheckout
      tags: [Commerce]
      summary: Read an owner-scoped Bazi deep-reading checkout status
      security:
        - deviceSession: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Checkout order, attempt, and confirmed-payment projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCheckoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/account/orders:
    get:
      operationId: listAccountOrders
      tags: [Identity]
      summary: Read private order and fulfillment facts for the current account
      security:
        - deviceSession: []
      responses:
        "200":
          description: Current account orders without payment provider identifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOrdersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/account/entitlements:
    get:
      operationId: listAccountEntitlements
      tags: [Identity]
      summary: Read private append-only entitlement projections for the current account
      security:
        - deviceSession: []
      responses:
        "200":
          description: Ledger projections and safe lifecycle events owned by the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEntitlementsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/account/history:
    get:
      operationId: listAccountHistory
      tags: [Identity]
      summary: Read private Reading Root and public version summaries for the current account
      security:
        - deviceSession: []
      responses:
        "200":
          description: Reading history grouped by owned Reading Root without private runtime context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountHistoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/account/notifications:
    get:
      operationId: listAccountNotifications
      tags: [Identity]
      summary: List private in-app notifications for the current account
      security:
        - deviceSession: []
      parameters:
        - name: unread_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Safe in-app notification projections without delivery payloads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountNotificationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/account/notifications/read-all:
    post:
      operationId: markAllAccountNotificationsRead
      tags: [Identity]
      summary: Mark every visible in-app notification as read
      security:
        - deviceSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Remaining unread count after the operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountNotificationsReadAllResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/account/notifications/{notification_id}/read:
    post:
      operationId: markAccountNotificationRead
      tags: [Identity]
      summary: Mark one owned in-app notification as read
      security:
        - deviceSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated safe in-app notification projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountNotificationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/account/notifications/{notification_id}:
    delete:
      operationId: deleteAccountNotification
      tags: [Identity]
      summary: Soft-delete one owned in-app notification
      security:
        - deviceSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Notification removed from the current account view
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/account/notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [Identity]
      summary: Read the current account's notification channel preferences
      security:
        - deviceSession: []
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferencesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateNotificationPreferences
      tags: [Identity]
      summary: Update the current account's notification channel preferences
      security:
        - deviceSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesRequest"
      responses:
        "200":
          description: Updated notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferencesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/account/closure:
    get:
      operationId: getAccountClosure
      tags: [Identity]
      summary: Read the active account closure request
      security:
        - deviceSession: []
      responses:
        "200":
          description: Active request or null
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ClosureResponse"
                  - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: requestAccountClosure
      tags: [Identity]
      summary: Request account closure with a seven-day cancellation window
      security:
        - deviceSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: Closure requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosureResponse"
        "200":
          description: Existing pending request returned idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosureResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: cancelAccountClosure
      tags: [Identity]
      summary: Cancel account closure before the seven-day deadline
      security:
        - deviceSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Closure cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/profiles/drafts:
    post:
      operationId: createProfileDraft
      tags: [Profiles]
      summary: Create an owned Profile Draft that can be confirmed once
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileDraftRequest"
      responses:
        "201":
          description: Draft created and bound to the current User or Guest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDraftResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/profiles/drafts/{draft_id}:
    delete:
      operationId: deleteProfileDraft
      tags: [Profiles]
      summary: Delete an unconfirmed Profile Draft owned by the current User or Guest
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Owned unconfirmed Profile Draft deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/profiles/drafts/{draft_id}/confirm:
    post:
      operationId: confirmProfileDraft
      tags: [Profiles]
      summary: Confirm a Draft into the first immutable encrypted Profile Version
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileConfirmRequest"
      responses:
        "201":
          description: Immutable Profile Version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
