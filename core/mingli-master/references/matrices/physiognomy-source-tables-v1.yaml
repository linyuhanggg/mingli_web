observation_contract:
  schema_version: mingli-physiognomy-input-v1
  observation_scope: face
  subject_side_definition: left and right always mean the photographed subject's anatomical side
  accepted_source_types: [image_transcription, user_text, user_file, user_correction]
  allowed_caller_operation: visible_transcription_only
  provider_performed_vision: false
  forbidden_provider_operations: [vision, image_decode, image_fetch, biometric_matching, identity_resolution]
  forbidden_all_actor_inferences:
    - health
    - diagnosis
    - disease
    - disability
    - race
    - ethnicity
    - nationality
    - religion
    - sex
    - gender
    - gender_identity
    - sexual_orientation
    - identity
    - age
    - character
    - personality
    - temperament
    - emotion
    - attractiveness
    - wealth
    - lifespan
    - criminality
    - protected_attribute
  forbidden_raw_media_fields:
    - raw_image
    - raw_image_base64
    - image_bytes
    - image_url
    - file_path
    - exif
    - face_embedding
    - biometric_template
  taxonomies: [anatomical_face_v1]
  allowed_regions:
    - forehead
    - left_eyebrow
    - right_eyebrow
    - left_eye
    - right_eye
    - nose
    - mouth
    - chin
    - jawline
    - left_ear
    - right_ear
    - left_cheek
    - right_cheek
    - complexion
  allowed_feature_kinds: [visible_morphology, capture_color]
  source_type_provenance_schema:
    image_transcription: image
    user_text: text
    user_file: text
    user_correction: same_as_superseded_observation
  descriptors:
    visible_morphology:
      forehead: [region_visible, relative_width_broad, relative_width_narrow, contour_rounded, contour_flat]
      left_eyebrow: &eyebrow_descriptors [region_visible, line_straight, line_curved, density_even, density_sparse_visible]
      right_eyebrow: *eyebrow_descriptors
      left_eye: &eye_descriptors [region_visible, aperture_open, aperture_narrow, alignment_level]
      right_eye: *eye_descriptors
      nose: [region_visible, bridge_straight, tip_rounded, relative_width_broad, relative_width_narrow]
      mouth: [region_visible, lip_line_straight, lip_line_curved, mouth_closed, mouth_open]
      chin: [region_visible, contour_rounded, contour_square, contour_pointed]
      jawline: [region_visible, outline_rounded, outline_angular]
      left_ear: &ear_descriptors [region_visible, outline_visible, partially_visible]
      right_ear: *ear_descriptors
      left_cheek: &cheek_descriptors [region_visible, contour_full_relative, contour_flat_relative]
      right_cheek: *cheek_descriptors
      complexion: [region_visible]
    capture_color:
      complexion: [tone_even_visible, tone_nonuniform_visible, color_observation_only]
  capture_color_regions: [complexion]
  allowed_scopes: [face, palm, posture, combined]
  mode_profiles:
    palm:
      taxonomies: [anatomical_palm_v1]
      allowed_regions: [left_palm, right_palm, life_line, head_line, heart_line, fate_line]
      allowed_feature_kinds: [visible_morphology]
      capture_color_regions: []
      source_profiles: [mayi_shenxiang, shenxiang_quanbian]
      active_source_rule_ids:
        - physiognomy/mayi-shenxiang#MR-01
        - physiognomy/mayi-shenxiang#MR-02
        - physiognomy/shenxiang-quanbian#SR-02-04
      descriptors:
        visible_morphology:
          left_palm: &palm_descriptors [region_visible, ridge_visible, texture_even_visible]
          right_palm: *palm_descriptors
          life_line: &palm_line_descriptors [region_visible, line_continuous, line_discontinuous, line_deep_visible, line_shallow_visible]
          head_line: *palm_line_descriptors
          heart_line: *palm_line_descriptors
          fate_line: *palm_line_descriptors
    posture:
      taxonomies: [posture_observation_v1]
      allowed_regions: [head_posture, shoulder_line, spine_curve, walking_gait, sitting_posture]
      allowed_feature_kinds: [visible_morphology]
      capture_color_regions: []
      source_profiles: [mayi_shenxiang, shenxiang_quanbian]
      active_source_rule_ids:
        - physiognomy/mayi-shenxiang#MR-01
        - physiognomy/mayi-shenxiang#MR-02
        - physiognomy/shenxiang-quanbian#SR-02-04
      descriptors:
        visible_morphology:
          head_posture: [region_visible, level, forward_tilt, backward_tilt]
          shoulder_line: [region_visible, level, uneven]
          spine_curve: [region_visible, aligned, curved]
          walking_gait: [region_visible, steady, uneven]
          sitting_posture: [region_visible, upright, forward_lean, uneven]

visibility_contract:
  pose_families: [frontal, left_profile, right_profile, three_quarter_left, three_quarter_right, detail, unknown]
  visible_subject_sides: [left, right, bilateral, unknown]
  framing: [full_face, upper_crop, lower_crop, region_crop, partial_unknown]
  framing_region_ceiling:
    full_face: [forehead, left_eyebrow, right_eyebrow, left_eye, right_eye, nose, mouth, chin, jawline, left_ear, right_ear, left_cheek, right_cheek, complexion]
    upper_crop: [forehead, left_eyebrow, right_eyebrow, left_eye, right_eye]
    lower_crop: [nose, mouth, chin, jawline]
    region_crop: [forehead, left_eyebrow, right_eyebrow, left_eye, right_eye, nose, mouth, chin, jawline, left_ear, right_ear, left_cheek, right_cheek, complexion]
    partial_unknown: [forehead, left_eyebrow, right_eyebrow, left_eye, right_eye, nose, mouth, chin, jawline, left_ear, right_ear, left_cheek, right_cheek, complexion]
  camera_angles: [frontal, three_quarter, profile, oblique, unknown]
  pose_angle_compatibility:
    frontal: [frontal]
    left_profile: [profile]
    right_profile: [profile]
    three_quarter_left: [three_quarter]
    three_quarter_right: [three_quarter]
    detail: [frontal, three_quarter, profile, oblique, unknown]
    unknown: [unknown]
  pose_region_ceiling:
    frontal: &bilateral_regions [forehead, left_eyebrow, right_eyebrow, left_eye, right_eye, nose, mouth, chin, jawline, left_ear, right_ear, left_cheek, right_cheek, complexion]
    left_profile: [forehead, left_eyebrow, left_eye, nose, mouth, chin, jawline, left_ear, left_cheek, complexion]
    right_profile: [forehead, right_eyebrow, right_eye, nose, mouth, chin, jawline, right_ear, right_cheek, complexion]
    three_quarter_left: [forehead, left_eyebrow, right_eyebrow, left_eye, right_eye, nose, mouth, chin, jawline, left_ear, left_cheek, right_cheek, complexion]
    three_quarter_right: [forehead, left_eyebrow, right_eyebrow, left_eye, right_eye, nose, mouth, chin, jawline, right_ear, left_cheek, right_cheek, complexion]
    detail: *bilateral_regions
    unknown: []
  subject_side_region_ceiling:
    left: [forehead, left_eyebrow, left_eye, nose, mouth, chin, jawline, left_ear, left_cheek, complexion]
    right: [forehead, right_eyebrow, right_eye, nose, mouth, chin, jawline, right_ear, right_cheek, complexion]
    bilateral: *bilateral_regions
    unknown: []
  descriptor_pose_compatibility:
    relative_width_broad: [frontal]
    relative_width_narrow: [frontal]
    alignment_level: [frontal]
  descriptor_context_requirements:
    relative_width_broad: &relative_width_context
      allowed_framings: [full_face, upper_crop]
      required_regions_by_observed_region:
        forehead: [left_eye, right_eye]
        nose: [left_cheek, right_cheek]
    relative_width_narrow: *relative_width_context
    alignment_level:
      allowed_framings: [full_face, upper_crop]
      required_regions: [left_eye, right_eye]
  minimum_region_anchor_pixels_per_axis: 1.0
  effective_visibility: pose_region_ceiling intersect framing_region_ceiling intersect supplied_visible_regions; detail additionally intersects declared subject side; descriptor pose/context gates and at-least-one-source-pixel anchor coverage also apply
  no_mirroring: true
  no_template_completion: true

quality_contract:
  lighting: [even, uneven, low, backlit, overexposed, color_cast, unknown]
  focus: [sharp, soft, blurred, unknown]
  resolution: [high, adequate, low, unknown]
  filtering: [none, color_only, geometry_altering, suspected, unknown]
  color_fidelity: [calibrated, uncalibrated, unknown]
  non_image_quality:
    lighting: not_applicable
    camera_angle: caller_description
    focus: not_applicable
    resolution: not_applicable
    filtering: not_applicable
    color_fidelity: not_applicable
  maximum_occlusion_inclusive: 0.5
  maximum_uncertainty_inclusive: 0.5
  visible_morphology:
    disallowed_lighting: [low, backlit, overexposed, unknown]
    disallowed_focus: [blurred, unknown]
    disallowed_resolution: [low, unknown]
    disallowed_filtering: [geometry_altering, suspected, unknown]
  capture_color:
    allowed_regions: [complexion]
    allowed_lighting: [even]
    allowed_camera_angles: [frontal, three_quarter]
    allowed_focus: [sharp]
    allowed_resolution: [high, adequate]
    allowed_filtering: [none]
    allowed_color_fidelity: [calibrated]

asset_contract:
  maximum_byte_length: 100000000
  maximum_pixel_axis: 100000

revision_contract:
  correction_source_type: user_correction
  correction_requires_supersedes_observation_id: true
  correction_must_keep_subject_target_region_feature_and_provenance_kind: true
  image_correction_must_keep: [asset_id, asset_sha256, capture_id]
  text_or_file_correction_must_keep: [source_ref, non_image_quality]
  correction_cycle_forbidden: true
  one_active_successor_per_observation: true
  same_capture_conflict_requires_confirmation: true
  different_capture_or_lighting_never_auto_equivalent: true
  different_capture_is_variation_not_conflict_without_explicit_relation: true
  explicit_comparison_relation: same_target_user_confirmed

