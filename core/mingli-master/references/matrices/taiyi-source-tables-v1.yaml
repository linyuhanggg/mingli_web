selected_convention:
  id: taiyi-jinjing-annual-yang-board-v1
  version: 1.0.0
  declared_scope: annual_macro_historical_board_facts
  unsupported_scopes: [personal_life, personal_event, medical, legal, military_action]
  calendar_boundary: lunar_new_year_from_shared_calendar
  annual_dun: yang
  interpretation_policy: calculated facts and predicates only; no event verdicts
  epoch_profile: jinjing-annual-tang-jiazi-v1
  boundary_rules:
    - The annual count is one-based and equals 1937281 in the Tang Jiazi year 724 CE.
    - The selected civil translation is accumulated_year = lunar_year + 1936557 for CE lunar years.
    - Six Ji use the 360-year cycle; five Zi-Yuan use five consecutive 72-year blocks.
    - The 72 annual bureaus repeat inside the 360-year cycle and cycle 理天、理地、理人 every three years.
    - Annual Taiyi and Tianmu move forward; the Yin 72-table belongs to a different time-count profile.
    - Main-board and long-cycle deity epochs remain separate and are emitted with their own epoch_profile.
    - No classical historical correspondence is converted into a modern prediction.
  incompatible_alternatives:
    - id: zhou-liwang-near-epoch
      status: separate_not_selected
      reason: L374-L411 starts from 周厉王三十七年甲子 and cannot be mixed with the volume-one upper epoch.
    - id: upper-jiayin-285011
      status: separate_long_cycle_only
      reason: L595-L617 belongs to the volume-five long-cycle deity methods, not the annual board.
    - id: yanjinian-10153917
      status: separate_not_selected
      reason: the later 演纪 accumulated-year recension is not the selected Taiyi Jinjing annual epoch.
    - id: yin-72-time-board
      status: separate_not_selected
      reason: the Yin table is a different time-count profile; annual calculation in this release is Yang.

