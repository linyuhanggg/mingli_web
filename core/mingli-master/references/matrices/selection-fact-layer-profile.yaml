  date_time_candidate_record:
    - "candidate_time_id"
    - "date_candidate_id"
    - "civil_start"
    - "civil_end_exclusive"
    - "effective_allowed_intervals"
    - "civil_datetime"
    - "instant_utc"
    - "hour_branch"
    - "lunar_date"
    - "ganzhi"
    - "jianchu"
    - "day_path"
    - "official_yiji"
    - "official_event_rules"
    - "event_specific_facts"
    - "active_source_rule_ids"
    - "directional_facts"
    - "eligibility"
    - "rejection_reasons"
    - "ranking_components"
stop_conditions:
  - code: "missing_selection_adapter"
    action: "stop"
    message: "No deterministic V5.1 Selection provider output; do not recommend or rank dates."
  - code: "anchor_only"
    action: "stop"
    message: "Gregorian date, lunar date, weekday, ganzhi, jianchu, or huangdao alone is only an anchor, not a selection fact layer."
  - code: "missing_calendar_normalization"
    action: "stop"
    message: "Missing calendar_normalization; do not interpret selection rules."
  - code: "missing_candidate_records"
    action: "stop"
    message: "Missing calendar_candidates or date_time_candidates records; do not rank candidate dates or times."
  - code: "official_folk_conflict"
    action: "preserve_conflict"
    message: "Use xieji-bianfang-shu as primary裁判 and keep yuqia-ji/donggong-zeri as comparison."
  - code: "rewritten_final_answer"
    action: "current_model_final_review"
    message: "Review the exact final answer against the latest question, calculated candidates, evidence, and counterevidence."
