<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>FateRadar</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f1e8; color: #173f35; }
    main { width: min(36rem, calc(100% - 3rem)); }
    small { letter-spacing: .16em; text-transform: uppercase; color: #8a713f; }
    h1 { margin: .75rem 0; font-size: clamp(2.5rem, 10vw, 5rem); line-height: .95; }
    p { margin: 0; color: #48635c; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <small>Infrastructure ready</small>
    <h1>FateRadar</h1>
    <p>网站正在搭建中，基础服务已经连接。</p>
  </main>
</body>
</html>
