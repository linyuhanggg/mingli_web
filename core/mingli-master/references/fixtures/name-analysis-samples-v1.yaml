schema_version: mingli-algorithm-source-samples-v1
purpose: >-
  Independent surname 五音 samples transcribed from 《五行精纪》卷九 tables.
  First-surname pins remain. Remaining-row samples are unambiguous 单姓
  collated from the same tables. Compound-surname samples use explicit
  family_name. Expectations must not be computed by a name-analysis
  provider. Cross-table conflicts stay unmatched.

cases:
  name-analysis-zhao-jiao:
    source_reference: 五行精纪 fulltext.md L2961 角音首姓
    input: {name: 赵青, usage_scene: unspecified}
    expected:
      family_name: 赵
      lookup_key: 趙
      tone: 角
      element: wood
      match_status: exact
      source_rule_id: name-analysis/wuxing-jingji#NA-WX-02
      hard_verdict: null
    verification: 趙 is the first surname of the 角音 table; 青 is given-name only

