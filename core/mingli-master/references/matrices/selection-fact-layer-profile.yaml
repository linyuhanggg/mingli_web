schema_version: "mingli-selection-fact-layer-profile-v1"
generated_at: "2026-07-24"
version: "v1.2"
source_status: "derived_from_ready_selection_packs"
purpose: "Validate the deterministic V5.1 Selection provider fact layer before interpreting selection reference packs."
shensha_ss_b2_refinement_ref: "references/matrices/shensha-ss-b2-selection-refinement.yaml"
official_primary_packs:
  - "selection/xieji-bianfang-shu"
  - "selection/xingli-kaoyuan"
folk_comparison_packs:
  - "selection/yuqia-ji"
  - "selection/donggong-zeri"
policy:
  requires_deterministic_selection_provider: true
  no_llm_calendar_math: true
  official_over_folk_on_conflict: true
  folk_books_are_comparison_only: true
  cultural_reference_not_fact_prediction: true
  current_model_final_review: true
  semantic_gate: false
  structured_event_profile_and_exact_actions: true
  natural_language_alias_routing: false
directional_context_contract:
  accepted_structured_fields:
    - "site_branch"
    - "site_mountain"
  minimum_required_for_directional_judgment: 1
  site_branch_domain: "twelve earthly branches"
  site_mountain_domain: "twenty-four mountains"
  missing_direction_policy: "fail closed without guessing"
base_required_fields:
  adapter:
    - "name"
    - "version"
    - "rule_profile"
    - "generated_at"
    - "license_status"
    - "dependency"
  input:
    - "selection_spec"
    - "timezone"
    - "location"
    - "input_digest"
  calendar_normalization:
    - "status"
    - "timezone"
    - "location"
    - "date_range"
    - "calendar_digests"
    - "calendar_profile"
  candidate_record:
    - "candidate_id"
    - "civil_date"
    - "calendar"
    - "jianchu"
    - "mansion"
    - "day_path"
    - "annual_gods"
    - "monthly_gods"
    - "daily_shensha"
    - "hour_facts"
    - "official_yiji"
    - "official_event_rules"
    - "event_specific_facts"
    - "active_source_rule_ids"
    - "directional_facts"
    - "eligibility"
    - "rejection_reasons"
    - "ranking_components"
    - "best_date_time_basis"
