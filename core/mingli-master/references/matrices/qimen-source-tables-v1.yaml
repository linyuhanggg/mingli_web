chief_director:
  chief_identity: star in the earth palace containing the Xunshou hidden instrument
  director_identity: door in the earth palace containing the Xunshou hidden instrument
  chief_destination: earth palace containing the hour stem, with Jia represented by the hidden instrument
  director_destination: advance the hour branch offset from the Xunshou palace through Lo Shu numbers, forward in Yang and reverse in Yin
  identity_duration: ten double-hours in the same Xun

