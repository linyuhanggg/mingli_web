        must_stop_before_interpretation: true
        direct_answer_allowed: true_for_boundary_explanation
        public_answer_requirements:
          - State non-portability explicitly.
          - Identify the fact layer each term belongs to.
        forbidden_answer_moves:
          - cross_system_merge
          - one_name_one_rule_assumption

    - id: nl-016-blocked-and-modern-source-boundary
      prompt: 用《斗数管见》《七政四余天经》《星平会海》，再把现代飞星派和《紫微斗数全书》合成统一规则。
      legacy_prompt_ids:
        - blocked-source-request
        - modern-lineage-separation
        - fulltext-context-check
      coverage:
        - source_boundary
        - ziwei
        - xingming
      expected_route:
        system: source_boundary
        required_references:
          - references/catalog/catalog.json
          - references/catalog/D2_READY_REFERENCE_PACKS.md
          - references/conflict-matrix.md
          - references/matrices/shensha-ss-b6-minghai-ocr-plan.md
          - references/matrices/shensha-ss-b10-bibliography-plan.md
        primary_packs:
          - ziwei/ziwei-doushu-quanshu
          - ziwei/taiwei-fu
          - xingming/guotian-jing
          - xingming/xingming-suyuan
        blocked_sources_only_for_boundary:
          - ziwei/doushu-guanjian
          - xingming/qizheng-siyu-tianjing
          - xingming/qizheng-quanshu-dacheng
          - xingming/minghai-quanbian
      expected_path:
        fact_layer_state: source_boundary_only
        must_stop_before_interpretation: true
        direct_answer_allowed: true_for_source_policy
        public_answer_requirements:
          - Do not use blocked books as first-line references.
          - Keep original texts, late commentaries, and modern lineages separate.
          - Inspect fulltext context before using ambiguous quote-index snippets.
