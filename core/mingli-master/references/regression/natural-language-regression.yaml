          - Keep shensha secondary to core bazi layers.
        forbidden_answer_moves:
          - shensha_as_primary_oracle
          - merge_bazhai_tianyi_or_liuren_tianyi_into_bazi_tianyi

    - id: nl-015-cross-system-shensha-misuse
      prompt: 八宅天医、六壬白虎、紫微化禄都能不能直接放进八字一起断？
      coverage:
