schema_version: mingli-physiognomy-posture-source-rules-v1
updated_at: "2026-08-21"
runtime_binding: not_in_runtime
provider_status: local_provider_not_in_runtime
method_id: mayi-form-bone-flesh-wuti-terminology-v1
excluded_methods:
  - western_bmi_somatotype_medical_posture
  - mayi_modern_appendix_foot_exercise
  - liuzhuang_gait_sitting_wealth_verdict
  - palm_observation
  - combined_face_palm_posture
  - llm_generated_physiognomy
  - health_lifespan_wealth_personality_verdict
  - voice_personality_diagnosis
audit_policy:
  research_source_root: external
  research_sources_distribution: local_research_only
  release_material: distilled_rules_provenance_and_checksums_only
  note: >-
    v1 freezes 见相 posture scope as terminology identity of 形、骨、肉、五体
    from 《麻衣神相》卷一 五行 / 卷二 相骨相肉 / 卷三 论四肢 (MY-004, MY-005, MY-007;
    admitted MY-002–MY-011 layer). 形 is 象数分类, not personality.
    Named 骨/肉 observations stay visible morphology. 《柳庄相法》论行/论坐
    names 行 and 坐 as sites but those rows carry 富贵贫贱 and are not a
    lookup table. 卷六 foot-fatigue / exercise language (MY-012–MY-014
    modern appendix) stays excluded. 声 belongs to 《神相全编》论声 and is
    not a v1 region. No catalog or signed Runtime binding. Local
    provider, if later written, must not invent a luck table.

