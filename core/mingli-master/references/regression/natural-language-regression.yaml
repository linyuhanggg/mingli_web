        forbidden_answer_moves:
          - invented_palaces
          - single_star_fortune

    - id: nl-010-xingming-ephemeris-required
      prompt: 我看到网上说 Moira/爱占星能排七政四余，我只给生日地点，你直接告诉我罗喉计都在哪宫。
