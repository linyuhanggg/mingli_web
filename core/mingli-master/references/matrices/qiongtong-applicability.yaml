# Qiongtong Baojian applicability matrix.
#
# Purpose: hard applicability filter for the near-time / formal fortune pipeline.
# The 穷通宝鉴 organizes tiaohou (climate) rules by day-master stem × solar-term
# month group. Chapters that do not match the natal day-master AND month command
# are ineligible regardless of BM25 semantic score.
#
# Accuracy note: chapter IDs use the canonical 三春/三夏/三秋/三冬 season labels.
# When a natal chart is under 己土日主 in 戌月, the only applicable Qiongtong
# chapter is 三秋己土 (with the 岁运合参 timing rule from 滴天髓阐微). 三春甲木
# and 七月丙火 are ineligible.
#
# The month_group value maps 12 branches to 4 seasons per the classical layout:
#   三春 = 寅卯辰
#   三夏 = 巳午未
#   三秋 = 申酉戌
#   三冬 = 亥子丑

