          type: string
          format: uuid
        existing_profile_version_id:
          type: string
          format: uuid
        suggested_save_as_name:
          type: string
        options:
          type: array
          items:
            type: string
            enum: [overwrite, save_as, cancel]
  responses:
    BadRequest:
      description: Invalid or expired request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: The operation's required Device or Guest owner session is missing or invalid; an invalid submitted Device Session expires stale device and CSRF cookies
      headers:
        Set-Cookie:
          description: May expire stale mingli_session and mingli_csrf cookies before re-authentication
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: CSRF or origin validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist or belongs to another owner
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The resource is in a state that does not allow this transition
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate or attempt limit reached
      headers:
        Retry-After:
          description: Number of seconds the client should wait before retrying
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Required dependency is unavailable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
