      type: object
      additionalProperties: false
      required:
        - capability_id
        - resolution
        - free_boundary_layer_id
        - paid_layer_ids
        - free_year_set
        - capability
        - layers
      properties:
        schema_version:
          type: string
          const: time-layer-entitlement/v1
          default: time-layer-entitlement/v1
        capability_id:
          type: string
          enum: [bazi, ziwei]
        resolution:
          type: string
          enum: [granted, denied, unknown, unauthenticated, request_failed]
        free_boundary_layer_id:
          type: string
          const: year
        paid_layer_ids:
          type: array
          minItems: 3
          maxItems: 3
          prefixItems:
            - type: string
              const: month
            - type: string
              const: day
            - type: string
              const: hour
        free_year_set:
          type: array
          description: Ordered civil years actually returned by the Runtime-backed ViewModel for the free year layer; clients must not assume a fixed count.
          items:
            type: integer
        capability:
          $ref: "#/components/schemas/TimeLayerEntitlementCapabilityResponse"
        layers:
          type: array
          items:
            $ref: "#/components/schemas/TimeLayerEntitlementLayerResponse"
