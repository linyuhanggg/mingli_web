# FateRadar 测试服务器回环入口（仅代码测试，非 staging/production）。
#
# 只监听 127.0.0.1:8080，不监听公网、不做 TLS、不涉及任何域名。
# 访问方式：操作者本机执行
#     ssh -L 18080:127.0.0.1:8080 fateradar-prod
# 然后在本机打开 http://127.0.0.1:18080
#
# 上游约定：FastAPI 监听 127.0.0.1:8000，Next.js standalone 监听 127.0.0.1:3000。
# 生产/备案入口见 fateradar.conf / fateradar-tls.conf，本配置不修改它们。

server {
    listen 127.0.0.1:8080;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"fateradar-test-loopback"}\n';
    }

    # API 统一反代到 FastAPI。Cookie/OTP/身份数据不能进中间层缓存，
    # 因此 API 响应一律 no-store。
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 覆写为直连客户端地址，避免客户端伪造 X-Forwarded-For。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        # 在此声明 Cache-Control 会中断 server 层 add_header 继承，需重列基线头。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control "private, no-store, max-age=0" always;
    }

    # 其余全部交给 Next.js standalone。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }
}
