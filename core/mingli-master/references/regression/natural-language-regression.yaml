      expected_route:
        system: ziwei
        required_references:
          - references/tool-adapters.md
          - references/system-cards/ziwei.md
          - references/matrices/shensha-ss-b4-ziwei-xingming-refinement.md
        primary_packs:
          - ziwei/ziwei-doushu-quanshu
          - ziwei/taiwei-fu
        support_packs:
          - ziwei/feixing-ziwei-doushu-yuanzhi
        required_adapter: tool.ziwei.bindisk
      expected_path:
        fact_layer_state: missing
        must_stop_before_interpretation: true
        direct_answer_allowed: false
        required_missing_outputs:
