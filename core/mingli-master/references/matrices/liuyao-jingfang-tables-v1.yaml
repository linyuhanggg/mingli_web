fact_boundaries:
  useful_spirit_selection: evidence_bound_adjudication
  calculated_candidate_pool: visible_changed-moving_and_source-derived-hidden_six-relative-positions
  query_word_matching: forbidden
  six_spirits_are_verdicts: false
  rules:
    - six relatives are calculated against the main hexagram palace element
    - changed-line Najia comes from the changed trigram but remains compared with its original moving line
    - a hidden line is emitted only for a six-relative category absent from both the visible main plate and changed moving lines, then is taken from the pure palace plate
    - month break is exact branch opposition to the shared calendar month command
    - useful-spirit rows are candidates; final selection remains evidence-bound adjudication
