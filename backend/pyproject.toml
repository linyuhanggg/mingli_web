[project]
name = "mingli-backend"
version = "0.1.0"
description = "FateRadar modular-monolith API and worker"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "jsonschema>=4.25,<5",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "pyyaml>=6.0,<7",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests", "../tests/contract"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "worker", "tests", "../tests/contract"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = [
  "B008",   # FastAPI dependency injection intentionally uses Depends in defaults.
  "EXE002", # The removable workspace volume does not preserve executable bits reliably.
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "worker"]

[tool.uv]
package = false
