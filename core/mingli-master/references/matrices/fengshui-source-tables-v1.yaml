evidence_binding_contract:
  version: 1.0.0
  identity: source_pack_hash_local_rule_id
  common_predicates:
    - {path_suffix: /fact_layer_status, operator: eq, value: observation_driven_fengshui_facts}
    - {path_suffix: /active_source_rule_ids, operator: descendant_eq, value: $rule_id}
  unsupported_rules_remain_inactive: true
  provider_must_never_emit_not_calculated_rule_ids: true
