primary_classical_rule_witnesses:
  xieji-xunshan-luohou-v1:
    source_profile: xieji_bianfang
    source_anchor: L1699-L1700
    event_profile: construction_renovation
    event_fact_field: luohou
    directional_formula_key: xunshan_luohou_by_year_branch
    evidence_rule_id: XR-18
    exact_quote: 起例巡山羅㬋為太嵗前一位子年在癸丑年在艮寅年在甲卯年在乙辰年在巽巳年在丙午年在丁未年在坤申年在庚酉年在辛戌年在乾亥年在壬○選擇宗鏡曰巡山羅㬋止忌立向開山修方不忌
    exact_quote_sha256: 824e100a53a07217c4872738abb8e7fe2fad9f637d807b79920633c8ec5f54e8
    normalized_formula: 子癸；丑艮；寅甲；卯乙；辰巽；巳丙；午丁；未坤；申庚；酉辛；戌乾；亥壬；止忌立向；开山、修方不忌
    normalized_formula_sha256: 2bbd9c5949152b6d78ea7fdbc39ab03519ca71e5cac4cc279c3dac8250f94470
    explicitly_taboo_actions: [立向]
    explicitly_exempt_actions: [开山, 修方]
    source_action_glyph_normalization: {开: 開}
    runtime_rank_policy: informational_until_same_palace_and_mitigation_facts_are_calculated
    runtime_evidence_statement: 巡山羅㬋按年支配二十四山；原文明确“止忌立向，开山、修方不忌”，且一白到向为吉、吉星到山到向可择用，与太岁同宫则勿犯。当前事实层未计算同宫与制化，因此仅作方位信息，不作硬淘汰。
    runtime_evidence_statement_sha256: ccabdc91a14e904b7006cab18342197237ee4214dbb9af25c5dc4063fb100b2a
    mitigation_witnesses:
      - source_anchor: L10778
        exact_excerpt: 巡山羅㬋占向一白到則吉
        exact_excerpt_sha256: 36b1757d2592669dc5d848f1eb6700d359f413788e0042ef8ca2c779d2ea8af4
        role: one_white_mitigation
      - source_anchor: L10969
        exact_excerpt: 宗鏡曰巡山羅㬋忌立向不忌開山修方
        exact_excerpt_sha256: e56cda9e42fa2a319adf8d3af98d19d75a9972756e13284efe67d39917982883
        role: explicit_action_scope
      - source_anchor: L10970
        exact_excerpt: 有吉星到山到向坐山乘旺猶可擇吉取用
        exact_excerpt_sha256: 88baa779a2edc6794de9589cae68757c07824796a8567978a34b43178dd56d6f
        role: non_same_palace_mitigation
      - source_anchor: L10970
        exact_excerpt: 則與太歳同宫勿犯可也
        exact_excerpt_sha256: 654ed24a53e62eea113e90e3be211d5f747f4616bb2b804fae9e50a186a5c7e5
        role: same_palace_prohibition
      - source_anchor: L11305
        exact_excerpt: 巡山羅㬋止忌立向
        exact_excerpt_sha256: 81a7c422b8f641aab4549e95ce9f374fbc9375b110042d3684ac21198fdbf7e0
        role: explicit_action_scope_restatement
    role: exact primary classical witness for the directional formula, explicit exemptions, and mitigation limits that preclude unconditional runtime elimination

