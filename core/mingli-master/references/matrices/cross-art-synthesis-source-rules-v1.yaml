lookup: {}

rules:
  - id: cross-art-synthesis/guotian-jing#CAS-GX-01
    title: 不可执泥一端
    status: verified
    evidence_role: terminology_only
    primary_sources: [*guotian_no_one_end]
    quote_index: GX-Q1282
    source_anchor: fulltext.md#L1530
    exact_excerpt: 不可执泥一端斯得之矣
    statement: >-
      合参必须保留异处。convergence 与 disagreements 是比较行，不得平均成一句吉凶，
      也不得 forced_resolution=true。
    boundary:
      - disagreement is retained; never collapsed into hard_verdict
      - empty comparison arrays remain valid when no comparable source predicates exist

  - id: cross-art-synthesis/ziwei-doushu-quanshu#CAS-ZW-01
    title: 紫微安星口诀不是合参融合表
    status: verified
    evidence_role: terminology_only
    primary_sources: [*ziwei_star_setup]
    quote_index: ZW-03
    source_anchor: fulltext.md#L952
    exact_excerpt: 甲廉破武阳为伴，乙机梁紫月交侵
    statement: >-
      紫微安星口诀只证明斗数身份。不得把八字用神、紫微宫星或七政黄经并成一张吉凶表。
    boundary:
      - natal 合参 arts stay independent
      - provider scope-name differences are not disagreements

  - id: cross-art-synthesis/huozhu-lin#CAS-HZ-01
    title: 六亲为主不是三术合断
    status: verified
    evidence_role: terminology_only
    primary_sources: [*huozhu_six_relatives]
    quote_index: HZL-001
    source_anchor: fulltext.md#L23
    exact_excerpt: 卦定根源，六亲为主
    statement: >-
      六爻以六亲为根源。问事合参里六爻、奇门、大六壬分支出事实；不得合成第四套断法。
    boundary:
      - wenshi comparison rows never invent a missing art
      - dimension_fact_scope presence is not source_bound_corroboration

  - id: cross-art-synthesis/bushi-zhengzong#CAS-BS-01
    title: 理无二致不是融合表
    status: verified
    evidence_role: source_gap
    primary_sources: [*bushi_one_principle]
    quote_index: BSZZ-1850
    source_anchor: fulltext.md#L1872
    exact_excerpt: 事有百端，理无二致
    statement: >-
      「理无二致」是编纂口诀，不是把六爻/奇门/六壬平均成一张吉凶表的授权。
    boundary:
      - one-principle slogans never yield exact luck lookup
      - fused_score / winner / arbitration fields are contract violations

  - id: cross-art-synthesis/guotian-jing#CAS-GX-02
    title: 合参吉凶表 fail-closed
    status: verified
    evidence_role: lookup_fact
    primary_sources: [*guotian_no_one_end]
    source_anchor: fulltext.md#L1530
    exact_excerpt: 不可执泥一端斯得之矣
    lookup: {}
    statement: >-
      无钉死吉凶行。比较行可 terminology exact；缺术保持 missing；
      hard_verdict 必须为 null；forced_resolution 必须为 false。
    boundary:
      - unmatched never upgrades to career, wealth, or event verdict
      - live hecan-view comparison rows are this structured contract
      - no catalog entry or signed Runtime binding

fail_closed:
  - v1 luck lookup is empty; hard_verdict is always null
  - forced_resolution is always false
  - empty convergence and disagreements are valid
  - selected arts with no facts stay in missing_art_ids; they are not invented
  - dimension_fact_scope alignment is not 互证
  - different provider scope names are not 分歧
  - 理无二致 / 归一理 slogans are unmatched, not corroboration
  - extra fields named luck, verdict, fused_score, winner, arbitration, llm are contract violations
  - no catalog entry or signed Runtime binding

