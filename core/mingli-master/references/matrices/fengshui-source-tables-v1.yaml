schema_version: mingli-fengshui-source-tables-v1
status: verified
purpose: >-
  Versioned mechanical compass normalization, source-transcribed Bazhai tables,
  observation eligibility, and exact source-rule activation contracts for the
  observation-driven Fengshui provider. The degree sectors are an engineering
  convention, not a claim that the classical texts state decimal-degree bounds.

selected_convention:
  id: north-centered-half-open-24-mountains
  version: 1.0.0
  classification: engineering_measurement_convention
  formula: floor((((corrected_true_degrees + 7.5) % 360) / 15))
  raw_degree_domain: "finite real number in [0, 360); bool is invalid"
  corrected_wrap_policy: explicit_only_after_declared_correction
  sitting_policy: add_twelve_mountain_indices
  boundary_policy: half_open_clockwise
  north_reference_policy:
    "true": correction_degrees_must_be_zero
    magnetic: caller_supplies_signed_correction_degrees_and_source
    grid: caller_supplies_signed_correction_degrees_and_source
  no_external_declination_lookup: true
  source_boundary: >-
    The classical witnesses establish the 24 names and three-mountain trigram
    groups. Equal 15-degree sectors, north at zero, and half-open allocation are
    this version's auditable engineering convention.

