source_layer_contract:
  priority_order:
    - primary_liuzhuang_lineage
    - side_evidence_classical_compilation
    - mixed_web_transcription
  no_majority_vote: true
  no_independent_cross_check_claim_for_compiled_shared_material: true
  later_accretions_never_first_line: true
  disagreements:
    - id: liuzhuang_vs_compilation
      sources: [physiognomy/liuzhuang-xiangfa, physiognomy/shenxiang-quanbian]
      policy: retain_separate_source_ids_without_forced_resolution
      public_sources: [柳庄相法, 神相全编]
      public_summary: 柳庄相法作为主线，神相全编作为汇编旁证；分层保留，不强制合并
    - id: mayi_web_layer_boundary
      sources: [physiognomy/mayi-shenxiang]
      policy: MY-002-through-MY-011-only; modern additions excluded
      public_sources: [麻衣神相]
      public_summary: 仅采用 MY-002 至 MY-011 的古籍转写层，现代附益层明确排除

privacy_contract:
  provider_accepts_raw_media: false
  opaque_identifier_min_length: 36
  opaque_identifier_pattern: '^(?:sid|aid|cid|tid|oid|rid)-[0-9a-f]{32,64}$'
  opaque_identifier_namespaces: {subject_ref: sid, asset_id: aid, capture_id: cid, target_id: tid, observation_id: oid, source_ref: rid}
  private_fact_fields: [subject_ref, asset_id, capture_id, sha256, asset_sha256, region_anchor, observation_id, observation_ids, confirmed_observation_ids, supersedes_observation_id, target_id, source_ref, pixel_width, pixel_height, byte_length, media_type, framing, schema_version, taxonomy, source_type, transcription_actor, provider_performed_vision, source_layer_policy, comparison_relations, pack, source_layer, evidence_role, id, policy, sources]
  fact_index_allowlist: [fact_layer_status, observation_scope, active_source_rule_ids, normalized_visible_observations, missing_targets, uncertainties, observation_conflicts, cross_capture_variations, source_comparison, source_conditioned_patterns]
  fact_index_nested_private_fields: [subject_ref, asset_id, capture_id, sha256, asset_sha256, region_anchor, normalized_bbox, observation_id, observation_ids, confirmed_observation_ids, supersedes_observation_id, target_id, source_ref]
  public_basis_allowlist: [observation_scope, normalized_visible_observations, missing_targets, uncertainties, observation_conflicts, cross_capture_variations, source_comparison]
  public_copy_forbidden_tokens: [subject_ref, subject_refs, asset_id, capture_id, sha256, asset_sha256, region_anchor, normalized_bbox, observation_id, observation_ids, confirmed_observation_ids, supersedes_observation_id, target_id, source_ref, pixel_width, pixel_height, byte_length, media_type, pose_family, framing, supplied_visible_regions, schema_version, taxonomy, source_type, transcription_actor, provider_performed_vision, source_layer_policy, comparison_relations, face_embedding, biometric_template]
  region_anchor_public_policy: semantic_region_only_coordinates_private

evidence_binding_contract:
  version: 1.0.0
  required_predicates:
    - {path_suffix: /fact_layer_status, operator: eq, value: observation_driven_physiognomy_facts}
    - {path_suffix: /active_source_rule_ids, operator: descendant_eq, value: $rule_id}
  evidence_fact_ref_allowlist: [fact_layer_status, active_source_rule_ids]
