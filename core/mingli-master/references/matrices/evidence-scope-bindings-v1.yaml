      this binding creates no strength, outcome, timing, or event verdict.
    predicates:
    - operator: eq
      path_suffix: /output/useful_spirit_selection/question_context/question_class
      value: finance
    - operator: eq
      path_suffix: /output/useful_spirit_selection/role_adjudication/specific_line_adjudication/visible_candidate_count
      value: 2
    - operator: eq
