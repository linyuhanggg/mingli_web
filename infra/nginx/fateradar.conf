server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name fateradar.cn;

    root /var/www/fateradar/current;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.fateradar.cn;
    return 301 https://fateradar.cn$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.fateradar.cn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"fateradar-edge"}\n';
    }

    # FastAPI 上线后把此处替换为对 127.0.0.1:8000 的反向代理。
    location / {
        default_type application/json;
        return 503 '{"error":"api_not_deployed"}\n';
    }
}
