  mayi_form_bone_flesh: &mayi_form_bone_flesh
    title: 麻衣神相
    edition_or_recension: 全学网网页转写；仅 MY-002 至 MY-011 古籍转写层；卷六现代附益排除
    normalized_path: references/fulltext/physiognomy/mayi-shenxiang/fulltext.md
    sha256: c9b02fe305c963d1e22ba694daf600297d9e4d8c3adad8bfaa7316f9471e8bc2
    anchor: L494 精合而后神生而后形全；L569 相骨相肉；L1305 五体
    exact_excerpt: 精合而后神生，神生而后形全
    material: form/bone/flesh/five-body terminology; no BMI table; no luck lookup
    license_status: ancient text public domain; normalized source local research only
  liuzhuang_gait_sit_site: &liuzhuang_gait_sit_site
    title: 柳庄相法
    edition_or_recension: CTP 连续行表；行/坐条含富贵贫贱硬断，v1 只作部位点名旁证
    normalized_path: references/fulltext/physiognomy/liuzhuang-xiangfa/fulltext.md
    sha256: 04459fbe4f5d48e0810a8f0290c6f8f851754db02a2344fc109380aee6059af8
