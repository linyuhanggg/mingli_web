          type: [string, "null"]
        fact_panel:
          oneOf:
            - $ref: "#/components/schemas/ReadingFactPanel"
            - type: "null"
        view_model:
          oneOf:
            - type: object
              description: Versioned Runtime ViewModel selected by the reading product.
              additionalProperties: true
            - type: "null"
        capability:
          oneOf:
            - $ref: "#/components/schemas/CapabilityProjection"
            - type: "null"
        verification:
          oneOf:
            - $ref: "#/components/schemas/ReadingVerificationSummary"
            - type: "null"
        input_request:
          type: [object, "null"]
