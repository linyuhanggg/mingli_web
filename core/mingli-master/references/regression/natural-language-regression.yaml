      expected_route:
        system: san-shi/liuren
        required_references:
          - references/matrices/shensha-ss-b3-liuren-refinement.md
          - references/tool-adapters.md
        primary_packs:
          - san-shi/daliuren-daquan
          - san-shi/liuren-zhiyin
        support_packs:
          - san-shi/liuren-miben
        required_adapter: mingli-master.liuren_fact_adapter@2.1.0
      expected_path:
        fact_layer_state: missing
        must_stop_before_interpretation: true
        direct_answer_allowed: false
        required_missing_outputs:
          - calendar_normalization
          - 四课三传
          - 天将
          - 月将
          - 日辰
          - 占时
        public_answer_requirements:
          - Explain that one heavenly general or shensha is not enough.
          - Keep liuren 白虎 inside the liuren lesson boundary.
        forbidden_answer_moves:
          - white_tiger_single_factor_judgment
          - liuren_terms_moved_into_bazi_or_ziwei

    - id: nl-008-taiyi-macro-required
      prompt: 用太乙看下最近整体时势，主客谁胜？我只给了年份。
      coverage:
