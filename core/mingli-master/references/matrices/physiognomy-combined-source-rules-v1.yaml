schema_version: mingli-physiognomy-combined-source-rules-v1
updated_at: "2026-08-21"
runtime_binding: not_in_runtime
provider_status: local_provider_not_in_runtime
method_id: liuzhuang-mayi-branch-comparison-v1
excluded_methods:
  - averaged_luck_verdict
  - western_fused_score_personality_composite
  - mayi_modern_appendix_face_palm_twelve_palaces
  - mayi_jinsuo_one_principle_as_fusion
  - inventing_missing_branches
  - llm_generated_physiognomy
  - health_lifespan_wealth_personality_verdict
  - voice_as_combined_branch
audit_policy:
  research_source_root: external
  research_sources_distribution: local_research_only
  release_material: distilled_rules_provenance_and_checksums_only
  note: >-
    v1 freezes 见相 combined/综合观照 as branch comparison, not a fourth
    diagnostic method. Any non-empty subset of face/palm/posture is
    valid. Facts stay per branch. 共同印证 / 分歧 / 证据充足度 are comparison
    rows, never hard_verdict. 《柳庄相法》「不可定一理而推」forbids averaging
    or forced resolution. 《麻衣神相》卷三「加之以首，谓之五体」names 首+四肢
    composition (MY-007; admitted MY-002–MY-011). 「相法百家归一理」and
    卷六 面相手相十二宫 are not a fusion table. 声 is 神相全编 side evidence,
    not a v1 branch. No catalog or signed Runtime binding.

