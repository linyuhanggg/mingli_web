fail_closed:
  - unmatched surname yields match_status unmatched and tone null
  - given names have no v1 五音 table; given_name_wuyin is always null
  - extra fields named stroke, kangxi, wuge, sancai, luck, verdict, 吉凶 are contract violations
  - no Provider, catalog entry, or signed Runtime binding in this knife

