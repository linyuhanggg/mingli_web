          oneOf:
            - $ref: "#/components/schemas/ReadingDocumentV1"
            - type: "null"
          additionalProperties: true
        result_available:
          type: boolean
        poll_required:
          type: boolean
        poll_after_seconds:
          type: [integer, "null"]
          minimum: 0
        time_layer_entitlement:
          oneOf:
            - $ref: "#/components/schemas/TimeLayerEntitlementResponse"
            - type: "null"
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, request_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        request_id:
          type: string
        code:
          type: string
        owner_kind:
          type: string
          enum: [guest, user]
        limit_scope:
          type: string
          enum: [guest_session, user_account]
