openapi: 3.1.0
info:
  title: FateRadar Internal Standalone Model Port
  version: 1.0.0
  description: >-
    Closed company-internal contract for one standalone narrative generation call.
    The provider transport is an implementation detail and never a caller-controlled input.
paths:
  /internal/model/v1/generations:
    post:
      operationId: generateNarrativeCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelGenerationRequest"
      responses:
        "200":
          description: One locally validated narrative candidate and its audit receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelGenerationResponse"
components:
  schemas:
    ModelGenerationRequest:
      type: object
      additionalProperties: false
      required:
        - model_profile_id
        - narrative_policy
        - output_contract
        - prepared_brief
        - generation
        - idempotency
      properties:
        model_profile_id:
          type: string
          enum: [deepseek-v4-flash-p0-v1]
        narrative_policy:
          $ref: "#/components/schemas/NarrativePolicy"
        output_contract:
          $ref: "#/components/schemas/OutputContractEnvelope"
        prepared_brief:
          $ref: "../schemas/mingli-result-v2.schema.json#/$defs/readingBrief"
        generation:
          $ref: "#/components/schemas/GenerationLimits"
        idempotency:
          $ref: "#/components/schemas/OpaqueIdempotencyMetadata"
    NarrativePolicy:
      type: object
      additionalProperties: false
      required: [version, instructions]
      properties:
        version:
          type: string
          enum: [policy-v1]
        instructions:
          type: string
          minLength: 1
    OutputContractEnvelope:
      type: object
      additionalProperties: false
      required: [contract, candidate_json_schema]
      properties:
        contract:
          $ref: "../schemas/mingli-output-contract-v1.schema.json"
        candidate_json_schema:
          type: object
          description: The exact local Candidate schema supplied as data to the model.
    GenerationLimits:
      type: object
      additionalProperties: false
      required: [language, max_output_chars, temperature, max_output_tokens]
      properties:
        language:
          type: string
          minLength: 1
        max_output_chars:
          type: integer
          minimum: 1
        temperature:
          type: number
          minimum: 0
          maximum: 2
        max_output_tokens:
          type: integer
          minimum: 1
          maximum: 8192
    OpaqueIdempotencyMetadata:
      type: object
      additionalProperties: false
      required: [request_fingerprint, attempt]
      properties:
        request_fingerprint:
          type: string
          pattern: "^[0-9a-f]{64}$"
        attempt:
          type: integer
          minimum: 1
          maximum: 2
    ModelGenerationResponse:
      type: object
      additionalProperties: false
      required:
        - candidate
        - usage
        - latency_ms
        - provider_model_version
        - provider_request_id
        - request_fingerprint
        - cost
      properties:
        candidate:
          $ref: "../schemas/mingli-narrative-candidate-v1.schema.json"
        usage:
          $ref: "#/components/schemas/TokenUsage"
        latency_ms:
          type: integer
          minimum: 0
        provider_model_version:
          type: string
          enum: [deepseek-v4-flash]
        provider_request_id:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          maxLength: 128
        request_fingerprint:
          type: string
          pattern: "^[0-9a-f]{64}$"
        cost:
          $ref: "#/components/schemas/ModelCost"
    TokenUsage:
      type: object
      additionalProperties: false
      required: [input_tokens, output_tokens, total_tokens]
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    ModelCost:
      type: object
      additionalProperties: false
      required: [currency, microunits, price_snapshot_version]
      properties:
        currency:
          type: string
          enum: [CNY]
        microunits:
          type: integer
          minimum: 0
        price_snapshot_version:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          maxLength: 128
