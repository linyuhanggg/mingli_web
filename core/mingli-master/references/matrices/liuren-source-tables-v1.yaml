month_general_solar_term_mapping:
  source_profile: liuren_miben
  source_anchor: L3529-L3539
  source_excerpt_sha256: e9af6436dbcaa6cd7c340f06a5ba18a97a43374650a23b59fc5d903df57fa3f9
  source_transitions:
    雨水: 雨水前日卯初刻，太陽入衛用登明亥。
    春分: 春分後二巳一刻，入魯河魁作將明戌。
    谷雨: 穀雨後四亥初刻，入趙從魁用可稱酉。
    小满: 小滿後五酉三刻，入晉還須傳送興申。
    夏至: 夏至後四未一刻，入秦小吉用其名未。
    大暑: 大暑後三巳一亥，入周先用勝光靈午。
    处暑: 處暑後三巳二刻，入楚還當太乙迎巳。
    秋分: 秋分後七寅三刻，入鄭天罡用去亨辰。
    霜降: 霜降後九醜三刻，太衝運動宋州城卯。
    小雪: 小雪後七戌一刻，功曹將領入燕京寅。
    冬至: 冬至後四刻一刻，入吳大吉便休停醜。
    大寒: 大寒當日酉三刻，入齊神後歲功成子。
