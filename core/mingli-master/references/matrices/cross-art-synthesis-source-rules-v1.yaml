schema_version: mingli-cross-art-synthesis-source-rules-v1
updated_at: "2026-08-21"
runtime_binding: not_in_runtime
provider_status: local_provider_not_in_runtime
method_id: retain-disagreement-no-fusion-v1
excluded_methods:
  - averaged_luck_verdict
  - weighted_score_fusion
  - silent_winner_selection
  - inventing_missing_arts
  - dimension_fact_scope_as_convergence
  - provider_scope_name_as_disagreement
  - llm_generated_synthesis
  - bushi_one_principle_as_fusion
audit_policy:
  research_source_root: external
  research_sources_distribution: local_research_only
  release_material: distilled_rules_provenance_and_checksums_only
  note: >-
    v1 freezes 合参 convergence/disagreements as comparison rows, not a
    fourth diagnostic method. 八字、紫微、七政、六爻、奇门、大六壬 stay
    independent. Empty arrays are valid. 《果老星宗》「不可执泥一端」
    forbids forced_resolution. 《卜筮正宗》「理无二致」is a compilation
    slogan, not a license to average 六爻+奇门+六壬. Live hecan-view /
    wenshi-view / canwen-view reuse comparisonRow; local adjudicator
    is not in catalog or the signed Runtime.

