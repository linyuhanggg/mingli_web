server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name fateradar.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://fateradar.cn$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.fateradar.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://fateradar.cn$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.fateradar.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://api.fateradar.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fateradar.cn;

    ssl_certificate /etc/letsencrypt/live/fateradar.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fateradar.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/fateradar/current;
    index index.html;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.fateradar.cn;

    ssl_certificate /etc/letsencrypt/live/fateradar.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fateradar.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://fateradar.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.fateradar.cn;

    ssl_certificate /etc/letsencrypt/live/fateradar.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fateradar.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"fateradar-edge"}\n';
    }

    # FastAPI 上线后把此处替换为对 127.0.0.1:8000 的反向代理。
    location / {
        default_type application/json;
        return 503 '{"error":"api_not_deployed"}\n';
    }
}
