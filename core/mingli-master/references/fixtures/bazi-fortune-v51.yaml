schema_version: mingli-bazi-fortune-fixtures-v1
source_scope: >-
  Fixed regression cases for the verified sxtwl, Sanming luck-cycle, Ziping
  relation, and bounded Fortune conventions registered in
  algorithm-source-dependencies.yaml. Strength, following, transformation,
  and structure labels are deliberately expected as candidates, never verdicts.

cases:
  - id: natal-support-01
    category: strong_weak_dispute
    input: {pillars: [甲寅, 丙寅, 甲寅, 甲子]}
    expected: {day_element: 木, month_branch: 寅, adjudication: required}
  - id: natal-support-02
    category: strong_weak_dispute
    input: {pillars: [壬子, 癸亥, 壬子, 庚子]}
    expected: {day_element: 水, month_branch: 亥, adjudication: required}
  - id: natal-support-03
    category: strong_weak_dispute
    input: {pillars: [丙午, 丁巳, 丙寅, 甲午]}
    expected: {day_element: 火, month_branch: 巳, adjudication: required}
  - id: natal-pressure-01
    category: strong_weak_dispute
    input: {pillars: [庚申, 壬申, 甲午, 丙午]}
    expected: {day_element: 木, month_branch: 申, adjudication: required}
  - id: natal-pressure-02
    category: strong_weak_dispute
    input: {pillars: [甲寅, 乙卯, 庚午, 丙午]}
    expected: {day_element: 金, month_branch: 卯, adjudication: required}
  - id: natal-pressure-03
    category: strong_weak_dispute
    input: {pillars: [戊辰, 己未, 壬午, 丙午]}
    expected: {day_element: 水, month_branch: 未, adjudication: required}
  - id: natal-following-01
    category: following_dispute
    input: {pillars: [丙午, 丁巳, 庚午, 丙午]}
    expected: {day_element: 金, month_branch: 巳, adjudication: required}
  - id: natal-following-02
    category: following_dispute
    input: {pillars: [庚申, 辛酉, 甲申, 庚午]}
    expected: {day_element: 木, month_branch: 酉, adjudication: required}
  - id: natal-following-03
    category: following_dispute
    input: {pillars: [壬子, 癸亥, 丙子, 壬子]}
    expected: {day_element: 火, month_branch: 亥, adjudication: required}
  - id: natal-transform-01
    category: transformation_dispute
    input: {pillars: [甲子, 己巳, 甲辰, 己巳]}
    expected: {day_element: 木, month_branch: 巳, adjudication: required}
  - id: natal-transform-02
    category: transformation_dispute
    input: {pillars: [乙丑, 庚辰, 乙卯, 庚辰]}
    expected: {day_element: 木, month_branch: 辰, adjudication: required}
  - id: natal-transform-03
    category: transformation_dispute
    input: {pillars: [丙寅, 辛卯, 丙辰, 辛卯]}
    expected: {day_element: 火, month_branch: 卯, adjudication: required}

