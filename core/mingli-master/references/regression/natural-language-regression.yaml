suite:
  id: natural-language-regression-v0.1
  generated_at: "2026-07-05"
  public_output_tag: "【玄枢｜MINGLI】"
  purpose: >
    Natural-language regression benchmark for mingli-master. The benchmark does
    not prove metaphysical truth; it checks that ordinary prompts route to the
    right system, stop when deterministic fact layers are missing, preserve
    source boundaries, and keep public answers useful rather than templated.
  benchmark_principles:
    - route_before_reading
    - deterministic_fact_layer_before_interpretation
    - calendar_normalization_for_all_time_based_work
    - original_text_commentary_and_modern_lineage_separated
    - shensha_never_independent_oracle
    - direct_truth_first_answer_when_fact_layer_is_complete
    - user_visible_mingli_answers_start_with_public_tag
    - accuracy_claims_must_be_testable_and_scored
    - public_style_must_not_default_to_stale_business_motifs
    - daily_fortune_specificity_must_be_evidence_linked_not_noun_dense
    - formal_calculation_chart_before_judgment
  required_coverage:
    - implicit_trigger
    - daily_fortune_style
    - bazi
    - bazi_compatibility
    - divination
    - qimen
    - liuren
    - taiyi
    - ziwei
    - xingming
    - selection
    - fengshui
    - physiognomy
    - shensha
    - source_boundary
    - conflict_preservation
    - accuracy_calibration
    - privacy_case_log
    - high_stakes_truth_first
    - corpus_search
    - mixed_system_scope
  forbidden_public_motifs_for_generic_fortune:
    - 财务
    - 回款
    - 催回复
    - 收尾
    - 小财务动静
    - 谈小单
    - 改商品页
    - 店铺后台
    - 对方晚回
    - 临时改口
  cases:
    - id: nl-001-implicit-practical-decision
      prompt: 命理口径看一下：我今天适不适合买后轮刹车片？别写长报告，直接判断要不要。
      legacy_prompt_ids:
        - implicit-mingli-trigger-without-skill-name
      coverage:
        - implicit_trigger
        - divination
      expected_route:
        system: divination_or_practical_short_decision
        required_references:
          - references/routing.md
          - references/tool-adapters.md
        primary_packs:
          - divination/meihua-yishu
        required_adapter: tool.divination.qiguagua_when_formal_divination_is_claimed
      expected_path:
        fact_layer_state: missing_or_not_formally_cast
        must_stop_before_interpretation: true_if_formal_hexagram_is_needed
        direct_answer_allowed: true_only_as_practical_non_formal_judgment
        required_missing_outputs:
          - calendar_normalization
          - casting_method
          - 本卦
          - 动爻
          - 变卦
        public_answer_requirements:
          - Do not pretend a hidden hexagram or formal calculation exists.
          - If answering briefly, label it as practical tendency rather than a formal卦.
        forbidden_answer_moves:
          - invented_hexagram
          - formal_divination_without_adapter

    - id: nl-002-daily-fortune-anti-template
      prompt: 明天运势怎样？别每次都说财务、收尾、回款、催回复，太模板了。
      legacy_prompt_ids:
        - natural-chat-mingli-trigger-daily-fortune
        - natural-chat-tomorrow-fortune-anti-template
      coverage:
        - implicit_trigger
        - daily_fortune_style
      expected_route:
        system: daily_fortune
        required_references:
          - references/fortune-cron-reminders.md
          - references/safety-and-versioning.md
        primary_packs: []
        required_adapter: fortune_calendar_or_cached_valid_baseline_when_calculation_is_claimed
      expected_path:
        fact_layer_state: private_or_cached
        must_stop_before_interpretation: false
        direct_answer_allowed: true
        anti_template_gate: true
        public_answer_requirements:
          - Start with the exact public tag 【玄枢｜MINGLI】, then a natural conclusion rather than a report heading.
          - Show the current time basis and explain at least one decisive natal/transit mechanism.
          - Discuss a life domain only when selected by the user or supported by current event context and applicable evidence.
          - Keep private fact/source audit headings out of the public answer.
          - Treat unsupported concrete scene nouns as hallucination, not specificity.
          - Avoid stale business motifs from forbidden_public_motifs_for_generic_fortune.
        forbidden_answer_moves:
          - missing_visible_mingli_tag
          - method_report_after_public_tag
          - stale_reply_money_closing_motif
          - same_advice_repeated_across_days
          - random_multi_domain_scene_dump
          - unsupported_scene_invention

    - id: nl-003-bazi-missing-fact-layer
      prompt: 我只给出生年月日时，帮我看八字格局和调候用神，先别凭记忆硬排。
      legacy_prompt_ids:
        - bazi-source-aware-reading
        - time-calendar-normalization-required
        - bazi-tiaohou-required
      coverage:
        - bazi
      expected_route:
        system: bazi
        required_references:
          - references/matrices/bazi-core-decision-stack.md
          - references/matrices/bazi-core-decision-stack.yaml
          - references/tool-adapters.md
        primary_packs:
          - bazi/sanming-tonghui
          - bazi/yuanhai-ziping
          - bazi/qiongtong-baojian
        support_packs:
          - bazi/ziping-zhenquan
          - bazi/ditiansui-chanwei
        required_adapter: tool.bazi.paipan
      expected_path:
        fact_layer_state: missing
        must_stop_before_interpretation: true
        direct_answer_allowed: false
        required_missing_outputs:
          - calendar_normalization
          - 四柱
          - 藏干
          - 十神
          - 节气换月/月令
          - seasonal_tiaohou_profile
          - 大运/流年_when_used
        public_answer_requirements:
          - Explain exactly which fact outputs are missing.
          - Do not use qiongtong-baojian before seasonal/tiaohou markers exist.
        forbidden_answer_moves:
          - hand_calculated_four_pillars
          - 调候_from_four_pillars_only

    - id: nl-004-bazi-compatibility-complete-fact-layer
      prompt: 两个人八字都已经排好了，直接判断合不合、未来几年会不会结婚，别绕。
      coverage:
        - bazi
        - bazi_compatibility
      expected_route:
        system: bazi
        required_references:
          - references/matrices/bazi-core-decision-stack.md
          - references/public-reading-contract.md
          - references/accuracy-and-statistical-validation.md
        primary_packs:
          - bazi/sanming-tonghui
          - bazi/yuanhai-ziping
        support_packs:
          - bazi/qiongtong-baojian
      expected_path:
        fact_layer_state: complete_or_cached_verified
        must_stop_before_interpretation: false
        direct_answer_allowed: true
        required_fact_outputs:
          - both_charts_calendar_normalization
          - both_four_pillars
          - hidden_stems
          - ten_gods
          - seasonal_tiaohou_profile
          - active_luck_cycles
          - future_liunian_windows
        public_answer_requirements:
          - Lead with a hard compatibility verdict and score.
          - Separate static matching from future marriage timing.
          - Keep caveats short when user asks for direct verdict mode.
        forbidden_answer_moves:
          - personality_only_answer
          - marriage_probability_without_luck_cycles

    - id: nl-004b-ordinary-relationship-chat-is-not-mingli
      prompt: 他俩到底合不合？未来几年会不会结婚，还是容易分？别报告腔，直接说。
      legacy_prompt_ids:
        - ordinary-relationship-chat-does-not-trigger-mingli
      coverage:
        - admission_negative
        - ordinary_chat
      expected_route:
        system: ordinary_chat
        required_references: []
        primary_packs: []
        support_packs: []
      expected_path:
        fact_layer_state: not_applicable
        must_stop_before_interpretation: false
        direct_answer_allowed: true
        public_answer_requirements:
          - Answer as ordinary relationship chat.
          - Do not emit the Mingli tag or invent a chart.
        forbidden_answer_moves:
          - trigger_mingli_without_explicit_intent_or_chart_context
          - request_birth_data_for_an_ordinary_chat_question

    - id: nl-005-meihua-debt-recovery
      prompt: 算下我家被拖欠的 1300 万货款什么时候能拿回来？能拿回来多少？你可以按问事时间起梅花。
      legacy_prompt_ids:
        - meihua-qiguagua-required
      coverage:
        - divination
      expected_route:
        system: divination
        required_references:
          - references/tool-adapters.md
          - references/system-cards/divination.md
        primary_packs:
          - divination/meihua-yishu
        support_packs:
          - divination/zhouyi-zhezhong
        required_adapter: tool.divination.qiguagua
      expected_path:
        fact_layer_state: missing_until_adapter_output
        must_stop_before_interpretation: true
        direct_answer_allowed: false
        required_missing_outputs:
          - calendar_normalization
          - casting_method
          - 本卦
          - 动爻
          - 变卦
          - 体用
        public_answer_requirements:
          - If a tool output exists, answer amount/time directly and name the卦.
          - If no tool output exists, stop and request qiguagua-equivalent facts.
        forbidden_answer_moves:
          - hidden_hand_casting
          - amount_prediction_without_hexagram

    - id: nl-006-qimen-business-or-gambling
      prompt: 今晚这局/这场谈判能不能成？用奇门直接给时间窗口或下注方向。
      legacy_prompt_ids:
        - qimen-plate-missing
        - real-forum-qimen-wealth-window
        - gambling-direct-reading
      coverage:
        - qimen
        - high_stakes_truth_first
      expected_route:
        system: san-shi/qimen
        required_references:
          - references/tool-adapters.md
          - references/system-cards/san-shi.md
        primary_packs:
          - san-shi/qimen-dunjia-tongzhi
        required_adapter: tool.qimen.bindisk
      expected_path:
        fact_layer_state: missing
        must_stop_before_interpretation: true
        direct_answer_allowed: false
        required_missing_outputs:
          - calendar_normalization
          - 局数
          - 值符
          - 值使
          - 九宫
          - 星门神仪
          - 旬空
        public_answer_requirements:
          - Do not refuse solely because gambling is involved.
          - Do not invent a qimen plate; stop until plate output exists.
        forbidden_answer_moves:
          - betting_guarantee
          - qimen_verdict_without_plate

    - id: nl-007-liuren-full-lesson-required
      prompt: 用大六壬看这件事成不成，我给了时间但没起课，只知道白虎临身。
