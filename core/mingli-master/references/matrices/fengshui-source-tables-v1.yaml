observation_contract:
  accepted_source_types: [image_transcription, user_text, user_measurement, user_file]
  allowed_kinds: [road, water, terrain, entrance, layout, enclosure, ridge, opening]
  requested_variables_required_for_form: true
  forbidden_source_tools: [vision_ocr, vision_only, llm]
  image_required_fields: [asset_id, region_anchor, quality, uncertainty]
  asset_required_fields: [asset_id, media_type, role, sha256]
  region_anchor_profile: normalized_bbox_v1
  quality_enums:
    readability: [good, medium, low, unreadable]
    lighting: [good, uneven, low, not_applicable]
    scale: [known, approximate, unknown, caller_described]
    viewpoint: [top_down, orthogonal, aerial, ground_level, oblique, caller_description, unknown]
  source_quality_contracts:
    image_transcription:
      forbidden_lighting: [not_applicable]
      forbidden_scale: [caller_described]
      forbidden_viewpoint: [caller_description]
    non_image:
      allowed_sentinel_lighting: [not_applicable]
      allowed_sentinel_scale: [caller_described]
      allowed_sentinel_viewpoint: [caller_description]
  image_claim_quality:
    disallowed_lighting: [low]
    precision_required_kinds: [road, entrance, layout, opening]
    precision_allowed_scale: [known, approximate]
    precision_allowed_viewpoint: [top_down, orthogonal, aerial]
  low_quality_readability: [low, unreadable]
  maximum_claim_uncertainty: 0.5
  rule_activation:
    road:
      axis_toward_entrance:
        - fengshui/yangzhai-shishu#YZS-R003
    water:
      observed_water:
        - fengshui/huangdi-zhaijing#HDZJ-R006
        - fengshui/yangzhai-shishu#YZS-R001
      water_boundary_and_wind_shelter_observed:
        - fengshui/zangshu#R-02
      water_mouth_and_hall_observed:
        - fengshui/xuexin-fu#XXF-R01
      interlocking_water_pattern:
        - fengshui/xuexin-fu#XXF-R04
    terrain:
      observed_terrain:
        - fengshui/huangdi-zhaijing#HDZJ-R006
        - fengshui/yangzhai-shishu#YZS-R001
      highland_plainland_classification:
        - fengshui/hanlong-jing#R-01
      sheltered_open_hall:
        - fengshui/yilong-jing#R-05
        - fengshui/xuexin-fu#XXF-R01
      water_boundary_and_wind_shelter_observed:
        - fengshui/zangshu#R-02
    entrance:
      observed_entrance:
        - fengshui/yangzhai-shishu#YZS-R014
    layout:
      observed_layout:
        - fengshui/huangdi-zhaijing#HDZJ-R006
        - fengshui/yangzhai-shishu#YZS-R014

