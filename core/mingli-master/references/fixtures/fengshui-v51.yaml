schema_version: mingli-fengshui-fixtures-v51
fixture_contract_version: 2.0.0
purpose: >-
  Independently authored compass, door-origin Bazhai, source-scoped observation,
  quality, incomplete-floorplan, conflict, and school-isolation fixtures for
  Task 7L. Complete cases contain executable inputs; the audit never synthesizes
  them from a provider-owned base spec.
oracle_policy:
  provider_code_used_to_generate_expected: false
  evaluator_path: scripts/fengshui_fixture_reference.py
  evaluator_sha256: b6227e464506f80787922345097accf49b36d1a93a0ffe646dce8c4cb27c4384
  forbidden_imports: [reading_engine.fengshui]
  compass_expectations: manually_frozen_from_versioned_half_open_table
  bazhai_expectations: transcribed_from_door-origin_yangzhai_mnemonics
  image_expectations: human_authored_structured_annotations

fixture_templates:
  image_good: &image_good
    {readability: good, lighting: good, scale: known, viewpoint: top_down, occlusion: 0.0}
  ground_good: &ground_good
    {readability: good, lighting: good, scale: approximate, viewpoint: ground_level, occlusion: 0.0}
  text_good: &text_good
    {readability: good, lighting: not_applicable, scale: caller_described, viewpoint: caller_description, occlusion: 0.0}
  floorplan_asset: &floorplan_asset
