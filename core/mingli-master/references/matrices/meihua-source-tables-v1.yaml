method_contracts:
  time:
    required_facts: [event_datetime, timezone, location]
    upper_total: lunar_year_branch_number + lunar_month + lunar_day
    lower_total: lunar_year_branch_number + lunar_month + lunar_day + hour_branch_number
    moving_total: lunar_year_branch_number + lunar_month + lunar_day + hour_branch_number
  supplied_number:
    required_facts: [number, event_datetime, timezone, location, provenance]
    upper_total: number
    lower_total: hour_branch_number
    moving_total: number + hour_branch_number
  sound_count:
    required_facts: [count, event_datetime, timezone, location, observation_source]
    upper_total: count
    lower_total: hour_branch_number
    moving_total: count + hour_branch_number
  observation:
    required_facts: [upper_trigram, lower_trigram, event_datetime, timezone, location, observation_source]
    moving_total: upper_trigram_number + lower_trigram_number + hour_branch_number
    natural_language_classification: forbidden
  supplied_hexagram:
    required_facts: [upper_trigram, lower_trigram, moving_line, event_datetime, timezone, location, provenance]
    moving_total: supplied_moving_line

