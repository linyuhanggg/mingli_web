edition_statement: >-
  当前可检索底本为 CTP 维基区《六壬秘本》（ctp:wb348173）五个 wiki chapter 的本地转写，
  经归一化后按目录与卷题重组为十七卷。国立中央图书馆 NCL-06572 二册影印本（243 页）
  是版本与疑字锚点；本轮仅据影印第 72、179、234 页修复三处 CTP 章界乱码，并核对扫描目录，
  没有进行全书逐页逐行校勘。

author_attribution:
  catalog_attribution: "书题作清·金正音辑；本包称其为辑录/批注层，不据此把全部篇章都归为金正音原创。"
  transmitted_works: >-
    全书汇入《大六壬苗公鬼撮脚》、李九万百章歌、穿杨百章歌、通天鬼翼赋、玉成歌、玉田歌、
    壬机秘要法语、五要权衡篇、《管辂神书》、《六壬心镜经》及增附三才应事等不同传承单元。
  copyists_and_notes: >-
    文内可见李道生附记、顾商文补阙、黄晴崖与施锦堂照录/朱批，以及金氏旁注、朱批、改字；
    现有电子转写压平了版面，不能把所有无署名注语稳定归给某一人。

