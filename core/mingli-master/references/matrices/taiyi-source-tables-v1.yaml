formula_contracts:
  bureau: one_based_mod(accumulated_year, 72)
  cycle_position: one_based_mod(accumulated_year, 360)
  ji: ceil(cycle_position / 60)
  zi_yuan: ceil(cycle_position / 72)
  governance: governance_cycle[one_based_mod(accumulated_year, 3) - 1]
  taiyi: taiyi_forward_order[ceil(one_based_mod(accumulated_year, 24) / 3) - 1]
  tianmu: tianmu_expanded_cycle[one_based_mod(accumulated_year, 18) - 1]
  jishen: reverse twelve-branch walk beginning at 寅 for bureau one
  shiji: rotate the sixteen ring so Jishen is on 和德艮, then project Tianmu by the same offset
  count: from the eye toward Taiyi, count the eye main-palace number or one for an interval, add intervening main-palace numbers, and stop before Taiyi
  major_general: use the units digit; for an exact multiple of ten use the tens digit
  assistant_general: one_based decimal residue of three times the major general, with central five retained for residue zero

