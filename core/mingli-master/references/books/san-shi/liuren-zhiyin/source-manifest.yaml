edition_statement: >-
  当前检索底本为张洪《六壬指南注解》系统的完整电子注本，CTP 五个入口依次为卷首、
  卷一《心印赋》、卷二《指掌赋》、卷三《会纂占验指南》、卷之四《神煞指南》。
  NLC/Wikimedia 248 页扫描为原本影印见证。卷一、卷二另有较干净的《大六壬指南》
  文本镜像；完整注解镜像用于识别张洪增注和现代课例。
author_attribution:
  transmitted_fuyi: "《心印赋》《指掌赋》为先贤赋文，作者不在本包内强定。"
  chen_gongxian: "旧序称陈公献增注两赋并作《会纂》占验。"
  zhuang_gongyuan: "旧序称庄公远作《神煞图位》；卷末署‘云岳山人庄广之再识’，二名关系待版本学核定。"
  zhang_hong: "完整注本自序署北海张洪；其现代注释、史注及增补课例不得并称古籍原文。"

